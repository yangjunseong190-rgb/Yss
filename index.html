<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>월드박스 디럭스 시뮬레이터</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a1a">

  <style>
    * { 
      box-sizing: border-box; 
      touch-action: none; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      margin: 0; 
      padding: 0; 
      background: #111; 
      color: #eee; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 요약바 및 시간 컨트롤 */
    .header {
      height: 48px;
      background: #1e1e24;
      border-bottom: 2px solid #33333d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 10;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .stats-group {
      display: flex;
      gap: 6px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 3px;
      background: #121215;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid #3a3a42;
    }

    .speed-controls {
      display: flex;
      gap: 4px;
    }

    .speed-btn {
      background: #2a2a32;
      border: 1px solid #444450;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .speed-btn.active {
      background: #ef4444;
      border-color: #f87171;
    }

    /* 메인 캔버스 */
    #canvas-container {
      flex: 1;
      position: relative;
      background: #1a2516;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* 화면 줌 버튼 */
    .zoom-controls {
      position: absolute;
      right: 12px;
      bottom: 110px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }
    .zoom-btn {
      width: 40px;
      height: 40px;
      background: #2a2a32;
      color: #fff;
      border: 2px solid #444452;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    /* 하단 2단 컨트롤 구조 (카테고리 + 슬라이드 툴바) */
    .control-panel {
      background: #16161a;
      border-top: 2px solid #33333d;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* 카테고리 선택 탭 */
    .category-tabs {
      display: flex;
      background: #0d0d10;
      border-bottom: 1px solid #2a2a32;
    }

    .cat-btn {
      flex: 1;
      padding: 6px 0;
      background: transparent;
      border: none;
      color: #888;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      color: #60a5fa;
      background: #16161a;
      border-bottom: 2px solid #3b82f6;
    }

    /* 하단 슬라이드형 갓 파워 툴바 */
    .toolbar-wrapper {
      height: 64px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      padding: 6px 10px;
      -webkit-overflow-scrolling: touch;
    }
    .toolbar-wrapper::-webkit-scrollbar { display: none; }

    .toolbar {
      display: inline-flex;
      gap: 8px;
    }

    .tool-btn {
      width: 60px;
      height: 48px;
      background: #25252e;
      border: 2px solid #3f3f4d;
      border-radius: 8px;
      color: #ccc;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      gap: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tool-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.6);
    }
    .tool-btn span { font-size: 1.1rem; }
  </style>
</head>
<body>

  <!-- 상단 상태바 & 시간 배속 컨트롤 -->
  <div class="header">
    <div class="stats-group">
      <div class="stat-badge">🔴 <span id="redCount" style="color:#f87171">0</span></div>
      <div class="stat-badge">🔵 <span id="blueCount" style="color:#60a5fa">0</span></div>
      <div class="stat-badge">🧟 <span id="zombieCount" style="color:#4ade80">0</span></div>
    </div>
    
    <div class="speed-controls">
      <button class="speed-btn" id="spd-0" onclick="setSpeed(0)">⏸️</button>
      <button class="speed-btn active" id="spd-1" onclick="setSpeed(1)">1x</button>
      <button class="speed-btn" id="spd-5" onclick="setSpeed(5)">5x</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>
    
    <div class="zoom-controls">
      <div class="zoom-btn" onclick="zoom(1.25)">+</div>
      <div class="zoom-btn" onclick="zoom(0.8)">-</div>
      <div class="zoom-btn" style="font-size: 0.75rem;" onclick="resetCamera()">[ ]</div>
    </div>
  </div>

  <!-- 하단 컨트롤 패널 (카테고리 탭 + 가로 슬라이드 툴바) -->
  <div class="control-panel">
    <div class="category-tabs">
      <button class="cat-btn active" id="cat-life" onclick="switchCategory('life')">👥 생물/문명</button>
      <button class="cat-btn" id="cat-terrain" onclick="switchCategory('terrain')">🌍 지형/자연</button>
      <button class="cat-btn" id="cat-power" onclick="switchCategory('power')">⚡ 재앙/신벌</button>
    </div>

    <div class="toolbar-wrapper">
      <div class="toolbar">
        <!-- 생물 / 문명 카테고리 -->
        <button class="tool-btn active" data-category="life" id="tool-red" onclick="selectTool('red')">
          <span>🔴</span>레드국
        </button>
        <button class="tool-btn" data-category="life" id="tool-blue" onclick="selectTool('blue')">
          <span>🔵</span>블루국
        </button>
        <button class="tool-btn" data-category="life" id="tool-zombie" onclick="selectTool('zombie')">
          <span>🧟</span>좀비
        </button>

        <!-- 지형 / 자연 카테고리 -->
        <button class="tool-btn" data-category="terrain" id="tool-land" onclick="selectTool('land')" style="display:none;">
          <span>🌱</span>땅 생성
        </button>
        <button class="tool-btn" data-category="terrain" id="tool-water" onclick="selectTool('water')" style="display:none;">
          <span>🌊</span>바다 생성
        </button>
        <button class="tool-btn" data-category="terrain" id="tool-mountain" onclick="selectTool('mountain')" style="display:none;">
          <span>⛰️</span>산 생성
        </button>
        <button class="tool-btn" data-category="terrain" id="tool-tree" onclick="selectTool('tree')" style="display:none;">
          <span>🌲</span>나무 심기
        </button>

        <!-- 재앙 / 신벌 카테고리 -->
        <button class="tool-btn" data-category="power" id="tool-meteor" onclick="selectTool('meteor')" style="display:none;">
          <span>☄️</span>운석 투하
        </button>
        <button class="tool-btn" data-category="power" id="tool-heal" onclick="selectTool('heal')" style="display:none;">
          <span>💖</span>치유의 비
        </button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 지형 타일 설정 (80x80 그리드)
    const TILE_SIZE = 30;
    const COLS = 80;
    const ROWS = 80;
    const WORLD_WIDTH = COLS * TILE_SIZE;
    const WORLD_HEIGHT = ROWS * TILE_SIZE;

    const TILE = { WATER: 0, LAND: 1, MOUNTAIN: 2 };
    let grid = Array(COLS).fill(0).map(() => Array(ROWS).fill(TILE.LAND));

    let scale = 0.4;
    let offsetX = (canvas.width - WORLD_WIDTH * scale) / 2;
    let offsetY = (canvas.height - WORLD_HEIGHT * scale) / 2;

    let currentTool = 'red';
    let gameSpeed = 1;

    let humans = [];
    let zombies = [];
    let buildings = [];
    let trees = [];
    let meteors = [];
    let effects = [];

    // 사람 클래스
    class Human {
      constructor(x, y, faction) {
        this.x = x;
        this.y = y;
        this.faction = faction;
        this.hp = 100;
        this.maxHp = 100;
        this.wood = 0;
        this.speed = 1.6 + Math.random() * 0.6;
        this.vx = (Math.random() - 0.5) * this.speed;
        this.vy = (Math.random() - 0.5) * this.speed;
        this.walkTimer = 0;
      }

      update() {
        const tileX = Math.floor(this.x / TILE_SIZE);
        const tileY = Math.floor(this.y / TILE_SIZE);
        let speedMult = 1;
        if (tileX >= 0 && tileX < COLS && tileY >= 0 && tileY < ROWS) {
          if (grid[tileX][tileY] === TILE.WATER) speedMult = 0.3;
          if (grid[tileX][tileY] === TILE.MOUNTAIN) speedMult = 0.5;
        }

        let target = null;
        let minDist = 120;

        for (let z of zombies) {
          let d = Math.hypot(z.x - this.x, z.y - this.y);
          if (d < minDist) { minDist = d; target = z; }
        }

        if (!target) {
          for (let h of humans) {
            if (h.faction !== this.faction) {
              let d = Math.hypot(h.x - this.x, h.y - this.y);
              if (d < minDist) { minDist = d; target = h; }
            }
          }
        }

        if (target) {
          const angle = Math.atan2(target.y - this.y, target.x - this.x);
          this.vx = Math.cos(angle) * this.speed * speedMult;
          this.vy = Math.sin(angle) * this.speed * speedMult;

          if (minDist < 10) {
            target.hp -= 1.5;
          }
        } else {
          let nearestTree = null;
          let treeDist = 150;
          for (let t of trees) {
            let d = Math.hypot(t.x - this.x, t.y - this.y);
            if (d < treeDist) { treeDist = d; nearestTree = t; }
          }

          if (nearestTree && this.wood < 5) {
            const angle = Math.atan2(nearestTree.y - this.y, nearestTree.x - this.x);
            this.vx = Math.cos(angle) * this.speed * speedMult;
            this.vy = Math.sin(angle) * this.speed * speedMult;

            if (treeDist < 12) {
              this.wood += 1;
              trees = trees.filter(t => t !== nearestTree);
            }
          } else if (this.wood >= 5) {
            buildings.push({ x: this.x, y: this.y, faction: this.faction, hp: 150 });
            this.wood = 0;
          } else {
            this.walkTimer--;
            if (this.walkTimer <= 0) {
              const angle = Math.random() * Math.PI * 2;
              this.vx = Math.cos(angle) * this.speed * speedMult;
              this.vy = Math.sin(angle) * this.speed * speedMult;
              this.walkTimer = Math.floor(Math.random() * 50) + 30;
            }
          }
        }

        this.x += this.vx;
        this.y += this.vy;

        this.x = Math.max(10, Math.min(WORLD_WIDTH - 10, this.x));
        this.y = Math.max(10, Math.min(WORLD_HEIGHT - 10, this.y));

        for (let b of buildings) {
          if (b.faction === this.faction && Math.hypot(b.x - this.x, b.y - this.y) < 40) {
            this.hp = Math.min(this.maxHp, this.hp + 0.1);
            if (Math.random() < 0.002 && humans.length < 300) {
              humans.push(new Human(this.x + 10, this.y + 10, this.faction));
            }
          }
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = '#ffdbac';
        ctx.fillRect(-3, -10, 6, 5);

        ctx.fillStyle = this.faction === 'red' ? '#ef4444' : '#3b82f6';
        ctx.fillRect(-4, -5, 8, 7);

        ctx.fillStyle = '#1f2937';
        ctx.fillRect(-3, 2, 2, 4);
        ctx.fillRect(1, 2, 2, 4);

        if (this.hp < this.maxHp) {
          ctx.fillStyle = '#000';
          ctx.fillRect(-6, -14, 12, 2);
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(-6, -14, (this.hp / this.maxHp) * 12, 2);
        }

        ctx.restore();
      }
    }

    // 좀비 클래스
    class Zombie {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.hp = 80;
        this.speed = 1.2;
      }

      update() {
        let target = null;
        let minDist = 200;

        for (let h of humans) {
          let d = Math.hypot(h.x - this.x, h.y - this.y);
          if (d < minDist) { minDist = d; target = h; }
        }

        if (target) {
          const angle = Math.atan2(target.y - this.y, target.x - this.x);
          this.x += Math.cos(angle) * this.speed;
          this.y += Math.sin(angle) * this.speed;

          if (minDist < 10) {
            target.hp -= 3;
            if (target.hp <= 0) {
              zombies.push(new Zombie(target.x, target.y));
            }
          }
        } else {
          this.x += (Math.random() - 0.5) * this.speed;
          this.y += (Math.random() - 0.5) * this.speed;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = '#4ade80';
        ctx.fillRect(-3, -10, 6, 5);
        ctx.fillStyle = '#374151';
        ctx.fillRect(-4, -5, 8, 7);
        ctx.fillStyle = '#111827';
        ctx.fillRect(-3, 2, 2, 4);
        ctx.fillRect(1, 2, 2, 4);
        ctx.restore();
      }
    }

    // 운석 클래스
    class Meteor {
      constructor(targetX, targetY) {
        this.x = targetX + 200;
        this.y = targetY - 400;
        this.targetX = targetX;
        this.targetY = targetY;
        this.speed = 18;
        this.exploded = false;
      }

      update() {
        const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;

        if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 15) {
          this.exploded = true;
          const centerTileX = Math.floor(this.targetX / TILE_SIZE);
          const centerTileY = Math.floor(this.targetY / TILE_SIZE);

          for (let tx = centerTileX - 3; tx <= centerTileX + 3; tx++) {
            for (let ty = centerTileY - 3; ty <= centerTileY + 3; ty++) {
              if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) {
                if (Math.hypot(tx - centerTileX, ty - centerTileY) <= 3) {
                  grid[tx][ty] = TILE.WATER;
                }
              }
            }
          }

          humans = humans.filter(h => Math.hypot(h.x - this.targetX, h.y - this.targetY) > 90);
          zombies = zombies.filter(z => Math.hypot(z.x - this.targetX, z.y - this.targetY) > 90);
          buildings = buildings.filter(b => Math.hypot(b.x - this.targetX, b.y - this.targetY) > 100);
          trees = trees.filter(t => Math.hypot(t.x - this.targetX, t.y - this.targetY) > 100);

          effects.push({ type: 'explosion', x: this.targetX, y: this.targetY, radius: 90, life: 25 });
        }
      }

      draw() {
        ctx.save();
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function getTransformedPoint(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left - offsetX) / scale,
        y: (clientY - rect.top - offsetY) / scale
      };
    }

    function applyGodPower(pt) {
      if (pt.x < 0 || pt.x > WORLD_WIDTH || pt.y < 0 || pt.y > WORLD_HEIGHT) return;

      const tx = Math.floor(pt.x / TILE_SIZE);
      const ty = Math.floor(pt.y / TILE_SIZE);

      if (currentTool === 'red') {
        humans.push(new Human(pt.x, pt.y, 'red'));
      } else if (currentTool === 'blue') {
        humans.push(new Human(pt.x, pt.y, 'blue'));
      } else if (currentTool === 'tree') {
        trees.push({ x: pt.x + (Math.random()*16-8), y: pt.y + (Math.random()*16-8) });
      } else if (currentTool === 'land' || currentTool === 'water' || currentTool === 'mountain') {
        const typeMap = { 'land': TILE.LAND, 'water': TILE.WATER, 'mountain': TILE.MOUNTAIN };
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (tx+dx >= 0 && tx+dx < COLS && ty+dy >= 0 && ty+dy < ROWS) {
              grid[tx+dx][ty+dy] = typeMap[currentTool];
            }
          }
        }
      } else if (currentTool === 'zombie') {
        zombies.push(new Zombie(pt.x, pt.y));
      } else if (currentTool === 'meteor') {
        meteors.push(new Meteor(pt.x, pt.y));
      } else if (currentTool === 'heal') {
        effects.push({ type: 'heal', x: pt.x, y: pt.y, radius: 70, life: 20 });
        for (let h of humans) {
          if (Math.hypot(h.x - pt.x, h.y - pt.y) < 70) h.hp = h.maxHp;
        }
      }
    }

    let isTouchActive = false;
    let lastX = 0, lastY = 0;
    let initialTouchDist = 0;
    let lastMidX = 0, lastMidY = 0;

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        isTouchActive = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        if (currentTool !== null) {
          applyGodPower(getTransformedPoint(lastX, lastY));
        }
      } else if (e.touches.length === 2) {
        isTouchActive = false;
        const t1 = e.touches[0], t2 = e.touches[1];
        initialTouchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        lastMidX = (t1.clientX + t2.clientX) / 2;
        lastMidY = (t1.clientY + t2.clientY) / 2;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isTouchActive) {
        const touch = e.touches[0];
        const dx = touch.clientX - lastX;
        const dy = touch.clientY - lastY;

        if (currentTool === null) {
          offsetX += dx;
          offsetY += dy;
        } else {
          if (Math.hypot(dx, dy) > 12) {
            applyGodPower(getTransformedPoint(touch.clientX, touch.clientY));
          }
        }
        lastX = touch.clientX;
        lastY = touch.clientY;
      } else if (e.touches.length === 2) {
        const t1 = e.touches[0], t2 = e.touches[1];
        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        const midX = (t1.clientX + t2.clientX) / 2;
        const midY = (t1.clientY + t2.clientY) / 2;

        if (initialTouchDist > 0) {
          const factor = dist / initialTouchDist;
          const rect = canvas.getBoundingClientRect();
          const zoomX = midX - rect.left;
          const zoomY = midY - rect.top;

          const newScale = Math.min(Math.max(scale * factor, 0.15), 2.5);
          offsetX = zoomX - (zoomX - offsetX) * (newScale / scale);
          offsetY = zoomY - (zoomY - offsetY) * (newScale / scale);
          scale = newScale;

          offsetX += (midX - lastMidX);
          offsetY += (midY - lastMidY);
        }

        initialTouchDist = dist;
        lastMidX = midX;
        lastMidY = midY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialTouchDist = 0;
      if (e.touches.length === 0) isTouchActive = false;
    });

    function zoom(factor) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const newScale = Math.min(Math.max(scale * factor, 0.15), 2.5);
      offsetX = centerX - (centerX - offsetX) * (newScale / scale);
      offsetY = centerY - (centerY - offsetY) * (newScale / scale);
      scale = newScale;
    }

    function resetCamera() {
      scale = 0.4;
      offsetX = (canvas.width - WORLD_WIDTH * scale) / 2;
      offsetY = (canvas.height - WORLD_HEIGHT * scale) / 2;
    }

    // 카테고리 전환 함수
    function switchCategory(catName) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`cat-${catName}`).classList.add('active');

      document.querySelectorAll('.tool-btn').forEach(btn => {
        if (btn.dataset.category === catName) {
          btn.style.display = 'inline-flex';
        } else {
          btn.style.display = 'none';
        }
      });
    }

    // 도구 선택 / 토글 함수
    function selectTool(toolName) {
      if (currentTool === toolName) {
        currentTool = null;
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      } else {
        currentTool = toolName;
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tool-${toolName}`).classList.add('active');
      }
    }

    function setSpeed(spd) {
      gameSpeed = spd;
      document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`spd-${spd}`).classList.add('active');
    }

    function init() {
      resetCamera();
      
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          if (x < 5 || x > COLS-6 || y < 5 || y > ROWS-6) {
            grid[x][y] = TILE.WATER;
          }
        }
      }

      for (let i = 0; i < 15; i++) {
        humans.push(new Human(WORLD_WIDTH * 0.35 + (Math.random()*100-50), WORLD_HEIGHT * 0.5 + (Math.random()*100-50), 'red'));
        humans.push(new Human(WORLD_WIDTH * 0.65 + (Math.random()*100-50), WORLD_HEIGHT * 0.5 + (Math.random()*100-50), 'blue'));
      }

      for (let i = 0; i < 80; i++) {
        trees.push({ x: Math.random() * (WORLD_WIDTH - 200) + 100, y: Math.random() * (WORLD_HEIGHT - 200) + 100 });
      }
    }

    function loop() {
      for (let step = 0; step < gameSpeed; step++) {
        humans = humans.filter(h => h.hp > 0);
        for (let h of humans) h.update();

        zombies = zombies.filter(z => z.hp > 0);
        for (let z of zombies) z.update();

        for (let i = meteors.length - 1; i >= 0; i--) {
          meteors[i].update();
          if (meteors[i].exploded) meteors.splice(i, 1);
        }

        if (Math.random() < 0.03 && trees.length < 150) {
          trees.push({ x: Math.random() * (WORLD_WIDTH - 100) + 50, y: Math.random() * (WORLD_HEIGHT - 100) + 50 });
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          const type = grid[x][y];
          ctx.fillStyle = type === TILE.WATER ? '#1d4ed8' : (type === TILE.LAND ? '#2d4a1d' : '#4b5563');
          ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }

      for (let t of trees) {
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let b of buildings) {
        ctx.fillStyle = b.faction === 'red' ? '#991b1b' : '#1e40af';
        ctx.fillRect(b.x - 10, b.y - 10, 20, 20);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
      }

      for (let h of humans) h.draw();
      for (let z of zombies) z.draw();

      for (let m of meteors) m.draw();

      for (let i = effects.length - 1; i >= 0; i--) {
        let eff = effects[i];
        eff.life--;
        ctx.beginPath();
        ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
        if (eff.type === 'heal') {
          ctx.fillStyle = `rgba(74, 222, 128, ${eff.life / 20 * 0.4})`;
          ctx.fill();
        } else if (eff.type === 'explosion') {
          ctx.fillStyle = `rgba(239, 68, 68, ${eff.life / 25 * 0.6})`;
          ctx.fill();
        }
        if (eff.life <= 0) effects.splice(i, 1);
      }

      ctx.restore();

      const redCount = humans.filter(h => h.faction === 'red').length;
      const blueCount = humans.filter(h => h.faction === 'blue').length;
      document.getElementById('redCount').innerText = redCount;
      document.getElementById('blueCount').innerText = blueCount;
      document.getElementById('zombieCount').innerText = zombies.length;

      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
