<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영어 단어 학습 도우미</title>
    <style>
        /* --- 다크모드 및 모바일 터치 하이라이트 완전 방지 --- */
        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        }

        /* 아이폰 파란색 박스, 터치 하이라이트, 긴 터치 메뉴 전체 방지 */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        /* 입력창은 타이핑이 가능하도록 선택 허용 */
        input, textarea, select {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        /* 아이폰 인풋 자동완성 시 흰색 배경으로 바뀌는 현상 차단 */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #18181b inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        body {
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: #121212;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #27272a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* 탭 메뉴 */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: #18181b;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #27272a;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #71717a;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #6366f1;
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        h2 { font-size: 16px; margin-bottom: 10px; font-weight: 700; color: #f4f4f5; }
        p, label { font-size: 13px; color: #a1a1aa; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; }

        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            appearance: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #6366f1 !important;
        }

        button.btn-primary {
            width: 100%;
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        button.btn-primary:active { background-color: #4f46e5; }

        /* 카드 UI */
        .card-box {
            border: 1px solid #27272a;
            border-radius: 14px;
            padding: 30px 16px;
            text-align: center;
            margin: 14px 0;
            background: #18181b;
            cursor: pointer;
        }

        .card-title { font-size: 24px; font-weight: 800; color: #818cf8; margin-bottom: 6px; }
        .card-sub { font-size: 16px; color: #34d399; display: none; margin-top: 10px; }

        /* 단어 리스트 */
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px;
            margin: 8px 0;
            background: #18181b;
            color: #ffffff;
            border: 1px solid #27272a;
            border-radius: 10px;
            font-size: 14px;
        }

        .quiz-option:active { border-color: #6366f1; background: #27272a; }

        .loading {
            display: none;
            text-align: center;
            color: #818cf8;
            font-size: 12px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VOCA MASTER</h1>

    <!-- 탭 메뉴 -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchStep(1)">1. 등록</button>
        <button class="tab-btn" onclick="switchStep(2)">2. 뜻/설정</button>
        <button class="tab-btn" onclick="switchStep(3)">3. 학습</button>
        <button class="tab-btn" onclick="switchStep(4)">4. 테스트</button>
        <button class="tab-btn" onclick="switchStep(5)">🔁 복습</button>
    </div>

    <!-- 1단계: 단어 등록 -->
    <div id="step1" class="step-panel active">
        <h2>📥 1단계: 단어 등록</h2>
        <p style="margin-bottom: 10px;">단어만 입력하면 한글 뜻을 자동으로 번역하여 채워줍니다.</p>
        <div class="form-group">
            <textarea id="wordInput" rows="4" placeholder="영어 단어를 입력하세요&#10;예: apple, banana&#10;delicious"></textarea>
            <div id="loadingText" class="loading">⚡ 뜻 자동 번역 중...</div>
        </div>
        <button class="btn-primary" onclick="addWords()">단어 등록하기</button>

        <hr style="border: 0; height: 1px; background: #27272a; margin: 20px 0;">
        <h2>📷 사진(OCR) 등록</h2>
        <p style="margin-bottom: 8px;">단어장 사진을 선택하세요.</p>
        <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 8px;">
        <button class="btn-primary" onclick="simulateOCR()" style="background: #27272a;">사진에서 단어 추출</button>
    </div>

    <!-- 2단계: 뜻 검토 및 설정 -->
    <div id="step2" class="step-panel">
        <h2>⚙️ 2단계: 뜻 확인 및 설정</h2>
        <div id="editWordList" style="margin-bottom: 20px; max-height: 220px; overflow-y: auto;"></div>

        <h2>학습 방식 설정</h2>
        <div class="form-group" style="margin-top: 8px;">
            <select id="studyModeSelect" onchange="toggleModeOptions()">
                <option value="card">단어 카드로 학습</option>
                <option value="example">예문으로 학습</option>
            </select>
        </div>

        <div id="cardOptions" class="form-group">
            <label>카드 제시 방식</label>
            <select id="cardDirection">
                <option value="word_first">앞: 단어 / 뒤: 뜻</option>
                <option value="meaning_first">앞: 뜻 / 뒤: 단어</option>
                <option value="random">랜덤 (무작위)</option>
            </select>
        </div>

        <div id="exampleOptions" class="form-group" style="display: none;">
            <label>예문 1개당 단어 수 (1~3개)</label>
            <input type="number" id="wordsPerSentence" min="1" max="3" value="1">
        </div>
    </div>

    <!-- 3단계: 단어 학습 -->
    <div id="step3" class="step-panel">
        <h2>📖 3단계: 단어 학습</h2>
        <div id="studyContainer"></div>
    </div>

    <!-- 4단계: 테스트 -->
    <div id="step4" class="step-panel">
        <h2>📝 4단계: 테스트</h2>
        <div class="form-group" style="margin-top: 10px;">
            <select id="quizTypeSelect" onchange="renderQuiz()">
                <option value="blank">1. 문장 속 빈칸 채우기 (주관식)</option>
                <option value="word_to_meaning">2. 객관식: 단어보고 뜻 맞추기</option>
                <option value="meaning_to_word">3. 객관식: 뜻보고 단어 맞추기</option>
            </select>
        </div>
        <div id="quizContainer" style="margin-top: 16px;"></div>
    </div>

    <!-- 5단계: 복습하기 -->
    <div id="step5" class="step-panel">
        <h2>🔁 내 단어장 & 복습하기</h2>
        <div id="reviewList" style="margin-top: 10px;"></div>
    </div>
</div>

<script>
    let wordsDb = [
        { id: 1, word: "resilience", meaning: "회복력", example: "She showed resilience in tough times.", wrongCount: 1 },
        { id: 2, word: "meticulous", meaning: "꼼꼼한", example: "He is meticulous about his work.", wrongCount: 0 }
    ];

    function switchStep(stepNum) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === stepNum - 1);
        });
        document.querySelectorAll('.step-panel').forEach((panel, idx) => {
            panel.classList.toggle('active', idx === stepNum - 1);
        });

        if (stepNum === 2) renderStep2();
        if (stepNum === 3) renderStep3();
        if (stepNum === 4) renderQuiz();
        if (stepNum === 5) renderStep5();
    }

    // MyMemory 무료 번역 API (자동 뜻 가져오기)
    async function fetchKoreanMeaning(word) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ko`);
            const data = await res.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (e) {}
        return "뜻 확인 필요";
    }

    async function addWords() {
        const text = document.getElementById('wordInput').value.trim();
        if (!text) return alert("단어를 입력해주세요.");

        document.getElementById('loadingText').style.display = 'block';

        const rawList = text.replace(/,/g, '\n').split('\n');
        let addedCount = 0;

        for (let w of rawList) {
            w = w.trim();
            if (w && !wordsDb.some(item => item.word.toLowerCase() === w.toLowerCase())) {
                const autoMeaning = await fetchKoreanMeaning(w);
                wordsDb.push({
                    id: Date.now() + Math.random(),
                    word: w,
                    meaning: autoMeaning,
                    example: `This is an example sentence using ${w}.`,
                    wrongCount: 0
                });
                addedCount++;
            }
        }

        document.getElementById('loadingText').style.display = 'none';
        alert(`${addedCount}개 단어의 뜻이 자동으로 등록되었습니다!`);
        document.getElementById('wordInput').value = "";
    }

    function simulateOCR() {
        alert("사진에서 단어를 추출하여 등록했습니다!");
        wordsDb.push(
            { id: Date.now()+1, word: "innovation", meaning: "혁신", example: "Innovation drives success.", wrongCount: 0 }
        );
    }

    function renderStep2() {
        const listDiv = document.getElementById('editWordList');
        listDiv.innerHTML = wordsDb.map((item, idx) => `
            <div class="word-item">
                <strong style="color:#818cf8; width: 35%;">${item.word}</strong>
                <input type="text" value="${item.meaning}" style="width: 60%;" onchange="wordsDb[${idx}].meaning = this.value">
            </div>
        `).join('');
    }

    function toggleModeOptions() {
        const mode = document.getElementById('studyModeSelect').value;
        document.getElementById('cardOptions').style.display = mode === 'card' ? 'block' : 'none';
        document.getElementById('exampleOptions').style.display = mode === 'example' ? 'block' : 'none';
    }

    function renderStep3() {
        const mode = document.getElementById('studyModeSelect').value;
        const container = document.getElementById('studyContainer');

        if (mode === 'card') {
            const dir = document.getElementById('cardDirection').value;
            container.innerHTML = wordsDb.map(item => {
                let front = item.word, back = item.meaning;
                if (dir === 'meaning_first' || (dir === 'random' && Math.random() > 0.5)) {
                    front = item.meaning; back = item.word;
                }
                return `
                    <div class="card-box" onclick="this.querySelector('.card-sub').style.display = 'block'">
                        <div class="card-title">${front}</div>
                        <div class="card-sub">${back}<br><span style="font-size:12px; color:#a1a1aa;">${item.example}</span></div>
                        <p style="font-size: 11px; color: #71717a; margin-top: 10px;">(탭하여 뒷면 확인)</p>
                    </div>
                `;
            }).join('');
        } else {
            const num = parseInt(document.getElementById('wordsPerSentence').value) || 1;
            let html = "";
            for (let i = 0; i < wordsDb.length; i += num) {
                const chunk = wordsDb.slice(i, i + num);
                const wordsStr = chunk.map(w => `<b style="color:#818cf8">${w.word}</b>(${w.meaning})`).join(', ');
                const exStr = chunk.map(w => w.example).join(' ');
                html += `
                    <div style="background:#18181b; border:1px solid #27272a; padding:14px; border-radius:10px; margin-bottom:10px;">
                        <p style="margin-bottom:6px;">🔑 <strong>단어:</strong> ${wordsStr}</p>
                        <p>📖 <strong>예문:</strong> ${exStr}</p>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
    }

    function renderQuiz() {
        if (wordsDb.length === 0) return;
        const type = document.getElementById('quizTypeSelect').value;
        const container = document.getElementById('quizContainer');
        const target = wordsDb[Math.floor(Math.random() * wordsDb.length)];

        if (type === 'blank') {
            const blankEx = target.example.replace(new RegExp(target.word, 'gi'), "_______");
            container.innerHTML = `
                <p><strong>문제:</strong> 빈칸에 들어갈 영어 단어는?</p>
                <div style="background:#18181b; padding:14px; margin:10px 0; border-radius:8px; border-left:3px solid #6366f1;">
                    "${blankEx}"<br><span style="font-size:12px; color:#a1a1aa;">(뜻: ${target.meaning})</span>
                </div>
                <input type="text" id="quizAns" placeholder="영어 단어 입력" style="margin-bottom:10px;">
                <button class="btn-primary" onclick="checkAnswer('${target.word}', '${target.id}')">정답 제출</button>
            `;
        } else if (type === 'word_to_meaning') {
            const options = [target.meaning, "사려 깊은", "충동적인", "복잡한"].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <p><strong>문제:</strong> 다음 단어의 올바른 뜻은?</p>
                <div style="font-size:22px; font-weight:bold; color:#818cf8; margin:14px 0; text-align:center;">${target.word}</div>
                ${options.map(opt => `<button class="quiz-option" onclick="checkChoice('${opt}', '${target.meaning}', '${target.id}')">${opt}</button>`).join('')}
            `;
        } else {
            const options = [target.word, "candid", "meticulous", "ubiquitous"].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <p><strong>문제:</strong> 다음 뜻에 해당하는 올바른 단어는?</p>
                <div style="font-size:20px; font-weight:bold; color:#34d399; margin:14px 0; text-align:center;">${target.meaning}</div>
                ${options.map(opt => `<button class="quiz-option" onclick="checkChoice('${opt}', '${target.word}', '${target.id}')">${opt}</button>`).join('')}
            `;
        }
    }

    function checkAnswer(correct, id) {
        const userAns = document.getElementById('quizAns').value.trim();
        if (userAns.toLowerCase() === correct.toLowerCase()) alert("🎉 정답입니다!");
        else { alert(`❌ 오답입니다. 정답은 [${correct}] 입니다.`); markWrong(id); }
        renderQuiz();
    }

    function checkChoice(selected, correct, id) {
        if (selected === correct) alert("🎉 정답입니다!");
        else { alert(`❌ 오답입니다. 정답은 [${correct}] 입니다.`); markWrong(id); }
        renderQuiz();
    }

    function markWrong(id) {
        const item = wordsDb.find(w => w.id == id);
        if (item) item.wrongCount++;
    }

    function renderStep5() {
        const reviewList = document.getElementById('reviewList');
        const wrongWords = wordsDb.filter(w => w.wrongCount > 0);

        if (wrongWords.length === 0) {
            reviewList.innerHTML = "<p style='color:#34d399; font-weight:bold; text-align:center; padding:20px;'>🎉 복습할 오답 단어가 없습니다!</p>";
            return;
        }

        reviewList.innerHTML = wrongWords.map(w => `
            <div class="word-item">
                <div>
                    <strong>${w.word}</strong> - <span style="color:#a1a1aa;">${w.meaning}</span>
                    <span style="color:#ef4444; font-size:12px;">(오답 ${w.wrongCount}회)</span>
                </div>
                <button onclick="clearWrong('${w.id}')" style="background:#34d399; color:#000; border:none; padding:6px 10px; border-radius:6px; font-weight:bold; font-size:12px;">완료</button>
            </div>
        `).join('');
    }

    function clearWrong(id) {
        const item = wordsDb.find(w => w.id == id);
        if (item) item.wrongCount = 0;
        renderStep5();
    }
</script>
</body>
</html>
