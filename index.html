<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영어 단어 학습 도우미</title>
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #18181b;
            --card-border: #27272a;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-sub: #a1a1aa;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        /* 아이폰 꾹 누름 파란 박스 및 텍스트 드래그 방지 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 텍스트 입력창은 드래그 및 입력이 가능해야 함 */
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* 상단 탭 메뉴 */
        .nav-tabs {
            display: flex;
            gap: 6px;
            background: #0f0f12;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-sub);
            border-radius: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--text-main);
            background: var(--primary);
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        h2 { font-size: 18px; margin-bottom: 12px; font-weight: 600; }
        p, label { font-size: 14px; color: var(--text-sub); }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; }

        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #0f0f12;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button.btn-primary:active { background-color: var(--primary-hover); }

        /* 단어 카드 디자인 */
        .card-box {
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 32px 16px;
            text-align: center;
            margin: 16px 0;
            background: #0f0f12;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .card-box:active { border-color: var(--primary); }
        .card-title { font-size: 26px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
        .card-sub { font-size: 18px; color: var(--accent-green); display: none; margin-top: 10px; }

        /* 리스트 항목 */
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0f0f12;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px;
            margin: 8px 0;
            background: #0f0f12;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .quiz-option:active { border-color: var(--primary); background: #1a1a24; }

        /* 로딩 스피너 */
        .loading {
            display: none;
            text-align: center;
            color: var(--primary);
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 VOCA MASTER</h1>

    <!-- 탭 메뉴 -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchStep(1)">1. 등록</button>
        <button class="tab-btn" onclick="switchStep(2)">2. 뜻/설정</button>
        <button class="tab-btn" onclick="switchStep(3)">3. 학습</button>
        <button class="tab-btn" onclick="switchStep(4)">4. 테스트</button>
        <button class="tab-btn" onclick="switchStep(5)">🔁 복습</button>
    </div>

    <!-- 1단계: 단어 등록 -->
    <div id="step1" class="step-panel active">
        <h2>📥 1단계: 단어 등록</h2>
        <p style="margin-bottom: 12px;">단어만 입력하면 뜻을 번역 API로 자동으로 채워줍니다.</p>
        <div class="form-group">
            <textarea id="wordInput" rows="4" placeholder="등록할 단어를 입력하세요&#10;예: apple, banana&#10;delicious"></textarea>
            <div id="loadingText" class="loading">⚡ 뜻 자동 번역 추출 중...</div>
        </div>
        <button class="btn-primary" onclick="addWords()">단어 자동 등록하기</button>

        <hr style="border: 0; height: 1px; background: var(--card-border); margin: 24px 0;">
        <h2>📷 사진(OCR) 등록</h2>
        <p style="margin-bottom: 10px;">교재 및 단어장 이미지를 업로드하세요.</p>
        <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 8px;">
        <button class="btn-primary" onclick="simulateOCR()" style="background: #27272a;">사진에서 단어 추출</button>
    </div>

    <!-- 2단계: 뜻 검토 및 학습 옵션 -->
    <div id="step2" class="step-panel">
        <h2>⚙️ 2단계: 뜻 검토 및 설정</h2>
        <p style="margin-bottom: 12px;">자동 채워진 뜻을 확인하거나 직접 수정하세요.</p>
        
        <div id="editWordList" style="margin-bottom: 24px; max-height: 250px; overflow-y: auto;"></div>

        <h2>학습 방식 옵션</h2>
        <div class="form-group" style="margin-top: 8px;">
            <label>학습 모드 선택</label>
            <select id="studyModeSelect" onchange="toggleModeOptions()">
                <option value="card">단어 카드로 학습</option>
                <option value="example">예문으로 학습</option>
            </select>
        </div>

        <div id="cardOptions" class="form-group">
            <label>카드 제시 방식</label>
            <select id="cardDirection">
                <option value="word_first">앞: 단어 / 뒤: 뜻</option>
                <option value="meaning_first">앞: 뜻 / 뒤: 단어</option>
                <option value="random">랜덤 (무작위)</option>
            </select>
        </div>

        <div id="exampleOptions" class="form-group" style="display: none;">
            <label>예문 1개당 단어 수 (1~3개)</label>
            <input type="number" id="wordsPerSentence" min="1" max="3" value="1">
        </div>
    </div>

    <!-- 3단계: 단어 학습 -->
    <div id="step3" class="step-panel">
        <h2>📖 3단계: 단어 학습</h2>
        <div id="studyContainer"></div>
    </div>

    <!-- 4단계: 테스트 -->
    <div id="step4" class="step-panel">
        <h2>📝 4단계: 테스트</h2>
        <div class="form-group" style="margin-top: 10px;">
            <select id="quizTypeSelect" onchange="renderQuiz()">
                <option value="blank">1. 문장 속 빈칸 채우기 (주관식)</option>
                <option value="word_to_meaning">2. 객관식: 단어보고 뜻 맞추기</option>
                <option value="meaning_to_word">3. 객관식: 뜻보고 단어 맞추기</option>
            </select>
        </div>
        <div id="quizContainer" style="margin-top: 16px;"></div>
    </div>

    <!-- 5단계: 복습하기 -->
    <div id="step5" class="step-panel">
        <h2>🔁 내 단어장 & 복습하기</h2>
        <p style="margin-bottom: 12px;">테스트에서 틀린 단어들의 오답 횟수를 관리합니다.</p>
        <div id="reviewList"></div>
    </div>
</div>

<script>
    // 기본 데이터
    let wordsDb = [
        { id: 1, word: "resilience", meaning: "회복력", example: "She showed resilience in tough times.", wrongCount: 1 },
        { id: 2, word: "meticulous", meaning: "꼼꼼한", example: "He is meticulous about his work.", wrongCount: 0 },
        { id: 3, word: "pragmatic", meaning: "실용적인", example: "We need a pragmatic solution.", wrongCount: 0 }
    ];

    function switchStep(stepNum) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === stepNum - 1);
        });
        document.querySelectorAll('.step-panel').forEach((panel, idx) => {
            panel.classList.toggle('active', idx === stepNum - 1);
        });

        if (stepNum === 2) renderStep2();
        if (stepNum === 3) renderStep3();
        if (stepNum === 4) renderQuiz();
        if (stepNum === 5) renderStep5();
    }

    // 번역 API 호출 함수 (무료 MyMemory API)
    async function fetchKoreanMeaning(word) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ko`);
            const data = await res.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (e) {
            console.error("번역 실패:", e);
        }
        return "뜻을 확인해 주세요";
    }

    // 1단계: 단어 추가 및 뜻 자동 등록
    async function addWords() {
        const text = document.getElementById('wordInput').value.trim();
        if (!text) return alert("단어를 입력해주세요.");

        const loadingText = document.getElementById('loadingText');
        loadingText.style.display = 'block';

        const rawList = text.replace(/,/g, '\n').split('\n');
        let addedCount = 0;

        for (let w of rawList) {
            w = w.trim();
            if (w && !wordsDb.some(item => item.word.toLowerCase() === w.toLowerCase())) {
                const autoMeaning = await fetchKoreanMeaning(w);
                wordsDb.push({
                    id: Date.now() + Math.random(),
                    word: w,
                    meaning: autoMeaning,
                    example: `This is an example sentence using ${w}.`,
                    wrongCount: 0
                });
                addedCount++;
            }
        }

        loadingText.style.display = 'none';
        alert(`${addedCount}개 단어의 뜻을 자동으로 찾아 등록했습니다!`);
        document.getElementById('wordInput').value = "";
    }

    function simulateOCR() {
        alert("사진에서 단어 [innovation, persistent]를 추출하여 뜻과 함께 등록했습니다!");
        wordsDb.push(
            { id: Date.now()+1, word: "innovation", meaning: "혁신", example: "Innovation drives success.", wrongCount: 0 },
            { id: Date.now()+2, word: "persistent", meaning: "끈기있는", example: "Be persistent in learning.", wrongCount: 0 }
        );
    }

    // 2단계: 뜻 검토 및 세팅
    function renderStep2() {
        const listDiv = document.getElementById('editWordList');
        listDiv.innerHTML = wordsDb.map((item, idx) => `
            <div class="word-item">
                <strong style="width: 35%; color:var(--primary);">${item.word}</strong>
                <input type="text" value="${item.meaning}" style="width: 60%;" onchange="updateMeaning(${idx}, this.value)">
            </div>
        `).join('');
    }

    function updateMeaning(idx, val) {
        wordsDb[idx].meaning = val;
    }

    function toggleModeOptions() {
        const mode = document.getElementById('studyModeSelect').value;
        document.getElementById('cardOptions').style.display = mode === 'card' ? 'block' : 'none';
        document.getElementById('exampleOptions').style.display = mode === 'example' ? 'block' : 'none';
    }

    // 3단계: 학습 엔진
    function renderStep3() {
        const mode = document.getElementById('studyModeSelect').value;
        const container = document.getElementById('studyContainer');

        if (mode === 'card') {
            const dir = document.getElementById('cardDirection').value;
            container.innerHTML = wordsDb.map(item => {
                let front = item.word, back = item.meaning;
                if (dir === 'meaning_first' || (dir === 'random' && Math.random() > 0.5)) {
                    front = item.meaning; back = item.word;
                }
                return `
                    <div class="card-box" onclick="this.querySelector('.card-sub').style.display = 'block'">
                        <div class="card-title">${front}</div>
                        <div class="card-sub">${back}<br><span style="font-size:12px; color:var(--text-sub);">${item.example}</span></div>
                        <p style="font-size: 11px; color: var(--text-sub); margin-top: 12px;">(탭하여 뒷면 보기)</p>
                    </div>
                `;
            }).join('');
        } else {
            const num = parseInt(document.getElementById('wordsPerSentence').value) || 1;
            let html = "";
            for (let i = 0; i < wordsDb.length; i += num) {
                const chunk = wordsDb.slice(i, i + num);
                const wordsStr = chunk.map(w => `<b style="color:var(--primary)">${w.word}</b>(${w.meaning})`).join(', ');
                const exStr = chunk.map(w => w.example).join(' ');
                html += `
                    <div style="background:#0f0f12; border:1px solid var(--card-border); padding:16px; border-radius:10px; margin-bottom:12px;">
                        <p style="margin-bottom:6px;">🔑 <strong>포함 단어:</strong> ${wordsStr}</p>
                        <p style="color:var(--text-main);">📖 <strong>예문:</strong> ${exStr}</p>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
    }

    // 4단계: 테스트 엔진
    function renderQuiz() {
        if (wordsDb.length === 0) return;
        const type = document.getElementById('quizTypeSelect').value;
        const container = document.getElementById('quizContainer');
        const target = wordsDb[Math.floor(Math.random() * wordsDb.length)];

        if (type === 'blank') {
            const blankEx = target.example.replace(new RegExp(target.word, 'gi'), "_______");
            container.innerHTML = `
                <p><strong>문제:</strong> 빈칸에 들어갈 영어 단어를 적으세요.</p>
                <div style="background:#0f0f12; padding:16px; margin:12px 0; border-radius:8px; border-left:3px solid var(--primary); font-size:15px;">
                    "${blankEx}"<br><span style="font-size:12px; color:var(--text-sub);">(뜻: ${target.meaning})</span>
                </div>
                <input type="text" id="quizAns" placeholder="영어 단어 입력" style="margin-bottom:10px;">
                <button class="btn-primary" onclick="checkAnswer('${target.word}', '${target.id}')">정답 제출</button>
            `;
        } else if (type === 'word_to_meaning') {
            const options = [target.meaning, "사려 깊은", "충동적인", "복잡한"].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <p><strong>문제:</strong> 다음 단어의 올바른 뜻은?</p>
                <div style="font-size:24px; font-weight:bold; color:var(--primary); margin:16px 0; text-align:center;">${target.word}</div>
                ${options.map(opt => `<button class="quiz-option" onclick="checkChoice('${opt}', '${target.meaning}', '${target.id}')">${opt}</button>`).join('')}
            `;
        } else {
            const options = [target.word, "candid", "meticulous", "ubiquitous"].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <p><strong>문제:</strong> 다음 뜻에 해당하는 올바른 단어는?</p>
                <div style="font-size:22px; font-weight:bold; color:var(--accent-green); margin:16px 0; text-align:center;">${target.meaning}</div>
                ${options.map(opt => `<button class="quiz-option" onclick="checkChoice('${opt}', '${target.word}', '${target.id}')">${opt}</button>`).join('')}
            `;
        }
    }

    function checkAnswer(correct, id) {
        const userAns = document.getElementById('quizAns').value.trim();
        if (userAns.toLowerCase() === correct.toLowerCase()) {
            alert("🎉 정답입니다!");
        } else {
            alert(`❌ 오답입니다. 정답은 [${correct}] 입니다.`);
            markWrong(id);
        }
        renderQuiz();
    }

    function checkChoice(selected, correct, id) {
        if (selected === correct) {
            alert("🎉 정답입니다!");
        } else {
            alert(`❌ 오답입니다. 정답은 [${correct}] 입니다.`);
            markWrong(id);
        }
        renderQuiz();
    }

    function markWrong(id) {
        const item = wordsDb.find(w => w.id == id);
        if (item) item.wrongCount++;
    }

    // 5단계: 복습하기
    function renderStep5() {
        const reviewList = document.getElementById('reviewList');
        const wrongWords = wordsDb.filter(w => w.wrongCount > 0);

        if (wrongWords.length === 0) {
            reviewList.innerHTML = "<p style='color:var(--accent-green); font-weight:bold; text-align:center; padding:20px;'>🎉 복습할 오답 단어가 없습니다!</p>";
            return;
        }

        reviewList.innerHTML = wrongWords.map(w => `
            <div class="word-item">
                <div>
                    <strong style="color:var(--text-main);">${w.word}</strong> - <span style="color:var(--text-sub);">${w.meaning}</span>
                    <span style="color:var(--accent-red); font-size:12px; margin-left:6px;">(오답 ${w.wrongCount}회)</span>
                </div>
                <button onclick="clearWrong('${w.id}')" style="background:var(--accent-green); color:white; border:none; padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer;">완료</button>
            </div>
        `).join('');
    }

    function clearWrong(id) {
        const item = wordsDb.find(w => w.id == id);
        if (item) item.wrongCount = 0;
        renderStep5();
    }
</script>
</body>
</html>
