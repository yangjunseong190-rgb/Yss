<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 단어 학습 도우미</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .nav-tabs { display: flex; gap: 8px; border-bottom: 2px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 16px; border: none; background: none; font-size: 15px; font-weight: 600; cursor: pointer; color: #64748b; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .step-panel { display: none; }
        .step-panel.active { display: block; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background-color: var(--primary-hover); }
        
        /* 플래시카드 스타일 */
        .card-box { border: 2px dashed var(--primary); border-radius: 10px; padding: 40px; text-align: center; margin: 20px 0; background: #f0f3ff; cursor: pointer; }
        .card-title { font-size: 28px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .card-sub { font-size: 20px; color: #059669; display: none; }
        
        /* 단어 목록 리스트 */
        .word-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
        .quiz-option { display: block; width: 100%; text-align: left; margin: 8px 0; background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
        .quiz-option:hover { background: #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 영어 단어 학습 도우미</h1>

    <!-- 탭 메뉴 -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchStep(1)">1단계: 등록</button>
        <button class="tab-btn" onclick="switchStep(2)">2단계: 뜻/설정</button>
        <button class="tab-btn" onclick="switchStep(3)">3단계: 학습</button>
        <button class="tab-btn" onclick="switchStep(4)">4단계: 테스트</button>
        <button class="tab-btn" onclick="switchStep(5)">🔁 복습하기</button>
    </div>

    <!-- 1단계: 단어 등록 -->
    <div id="step1" class="step-panel active">
        <h2>📥 1단계: 단어 등록하기</h2>
        <div class="form-group" style="margin-top: 15px;">
            <label>직접 단어 입력 (줄바꿈 또는 쉼표 구분)</label>
            <textarea id="wordInput" rows="4" placeholder="apple&#10;banana, cherry&#10;delicious"></textarea>
        </div>
        <button onclick="addWords()">단어 등록하기</button>

        <hr style="margin: 20px 0;">
        <h3>📷 사진(OCR)으로 등록하기</h3>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 10px;">교재나 단어장 사진을 선택하면 단어를 추출합니다.</p>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="simulateOCR()" style="background-color: #059669; margin-top: 8px;">사진에서 단어 추출</button>
    </div>

    <!-- 2단계: 뜻 검토 및 설정 -->
    <div id="step2" class="step-panel">
        <h2>⚙️ 2단계: 뜻 확인 및 학습 방식 설정</h2>
        
        <h3 style="margin-top: 15px;">1. 단어 뜻 수정</h3>
        <div id="editWordList" style="margin-bottom: 20px;"></div>

        <h3>2. 학습 방식 설정</h3>
        <div class="form-group" style="margin-top: 10px;">
            <label>학습 모드 선택</label>
            <select id="studyModeSelect" onchange="toggleModeOptions()">
                <option value="card">단어 카드로 학습</option>
                <option value="example">예문으로 학습</option>
            </select>
        </div>

        <div id="cardOptions" class="form-group">
            <label>카드 제시 방식</label>
            <select id="cardDirection">
                <option value="word_first">앞: 단어 / 뒤: 뜻</option>
                <option value="meaning_first">앞: 뜻 / 뒤: 단어</option>
                <option value="random">랜덤 (무작위)</option>
            </select>
        </div>

        <div id="exampleOptions" class="form-group" style="display: none;">
            <label>예문 1개당 포함할 단어 수 (1~3개)</label>
            <input type="number" id="wordsPerSentence" min="1" max="3" value="1">
        </div>
    </div>

    <!-- 3단계: 단어 학습 -->
    <div id="step3" class="step-panel">
        <h2>📖 3단계: 단어 학습하기</h2>
        <div id="studyContainer"></div>
    </div>

    <!-- 4단계: 테스트 -->
    <div id="step4" class="step-panel">
        <h2>📝 4단계: 테스트</h2>
        <div class="form-group" style="margin-top: 15px;">
            <label>테스트 유형 선택</label>
            <select id="quizTypeSelect" onchange="renderQuiz()">
                <option value="blank">1. 문장 속 빈칸 채우기 (주관식)</option>
                <option value="word_to_meaning">2. 객관식: 단어 보고 뜻 맞추기</option>
                <option value="meaning_to_word">3. 객관식: 뜻 보고 단어 맞추기</option>
            </select>
        </div>
        <div id="quizContainer" style="margin-top: 20px;"></div>
    </div>

    <!-- 복습하기 -->
    <div id="step5" class="step-panel">
        <h2>🔁 내 단어장 & 복습하기</h2>
        <p style="margin-bottom: 15px;">테스트에서 틀린 단어를 재학습할 수 있습니다.</p>
        <div id="reviewList"></div>
    </div>
</div>

<script>
    // 기본 데이터베이스
    let wordsDb = [
        { id: 1, word: "resilience", meaning: "회복력", example: "She showed resilience in tough times.", wrongCount: 1 },
        { id: 2, word: "meticulous", meaning: "꼼꼼한", example: "He is meticulous about his work.", wrongCount: 0 },
        { id: 3, word: "pragmatic", meaning: "실용적인", example: "We need a pragmatic solution.", wrongCount: 2 }
    ];

    function switchStep(stepNum) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === stepNum - 1);
        });
        document.querySelectorAll('.step-panel').forEach((panel, idx) => {
            panel.classList.toggle('active', idx === stepNum - 1);
        });

        if (stepNum === 2) renderStep2();
        if (stepNum === 3) renderStep3();
        if (stepNum === 4) renderQuiz();
        if (stepNum === 5) renderStep5();
    }

    // 1단계: 단어 추가
    function addWords() {
        const text = document.getElementById('wordInput').value.trim();
        if (!text) return alert("단어를 입력해주세요.");
        
        const list = text.replace(/,/g, '\n').split('\n');
        list.forEach(w => {
            w = w.trim();
            if (w && !wordsDb.some(item => item.word.toLowerCase() === w.toLowerCase())) {
                wordsDb.push({
                    id: Date.now() + Math.random(),
                    word: w,
                    meaning: "뜻을 입력하세요 (2단계)",
                    example: `This is an example sentence using ${w}.`,
                    wrongCount: 0
                });
            }
        });
        alert("단어가 등록되었습니다!");
        document.getElementById('wordInput').value = "";
    }

    function simulateOCR() {
        alert("사진에서 단어 [innovation, persistent]를 추출하여 등록했습니다!");
        wordsDb.push(
            { id: Date.now()+1, word: "innovation", meaning: "혁신", example: "Innovation drives success.", wrongCount: 0 },
            { id: Date.now()+2, word: "persistent", meaning: "끈기있는", example: "Be persistent in learning.", wrongCount: 0 }
        );
    }

    // 2단계: 뜻 검토 및 옵션 설정
    function renderStep2() {
        const listDiv = document.getElementById('editWordList');
        listDiv.innerHTML = wordsDb.map((item, idx) => `
            <div class="word-item">
                <strong>${item.word}</strong>
                <input type="text" value="${item.meaning}" style="width: 60%;" onchange="updateMeaning(${idx}, this.value)">
            </div>
        `).join('');
    }

    function updateMeaning(idx, val) {
        wordsDb[idx].meaning = val;
    }

    function toggleModeOptions() {
        const mode = document.getElementById('studyModeSelect').value;
        document.getElementById('cardOptions').style.display = mode === 'card' ? 'block' : 'none';
        document.getElementById('exampleOptions').style.display = mode === 'example' ? 'block' : 'none';
    }

    // 3단계: 학습 엔진
    function renderStep3() {
        const mode = document.getElementById('studyModeSelect').value;
        const container = document.getElementById('studyContainer');

        if (mode === 'card') {
            const dir = document.getElementById('cardDirection').value;
            container.innerHTML = wordsDb.map(item => {
                let front = item.word, back = item.meaning;
                if (dir === 'meaning_first' || (dir === 'random' && Math.random() > 0.5)) {
                    front = item.meaning; back = item.word;
                }
                return `
                    <div class="card-box" onclick="this.querySelector('.card-sub').style.display = 'block'">
                        <div class="card-title">${front}</div>
                        <div class="card-sub">정답: ${back}<br><small style="color:#64748b">${item.example}</small></div>
                        <p style="font-size: 12px; color: #94a3b8; margin-top: 10px;">(클릭하여 뒷면 보기)</p>
                    </div>
                `;
            }).join('');
        } else {
            const num = parseInt(document.getElementById('wordsPerSentence').value) || 1;
            let html = "";
            for (let i = 0; i < wordsDb.length; i += num) {
                const chunk = wordsDb.slice(i, i + num);
                const wordsStr = chunk.map(w => `<b>${w.word}</b>(${w.meaning})`).join(', ');
                const exStr = chunk.map(w => w.example).join(' ');
                html += `
                    <div style="border:1px solid #cbd5e1; padding:15px; border-radius:8px; margin-bottom:12px;">
                        <p>🔑 <strong>포함 단어:</strong> ${wordsStr}</p>
                        <p style="margin-top:8px;">📖 <strong>예문:</strong> ${exStr}</p>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
    }

    // 4단계: 테스트
    function renderQuiz() {
        if (wordsDb.length === 0) return;
        const type = document.getElementById('quizTypeSelect').value;
        const container = document.getElementById('quizContainer');
        const target = wordsDb[Math.floor(Math.random() * wordsDb.length)];

        if (type === 'blank') {
            const blankEx = target.example.replace(new RegExp(target.word, 'gi'), "_______");
            container.innerHTML = `
                <p><strong>문제:</strong> 빈칸에 들어갈 올바른 단어를 입력하세요.</p>
                <blockquote style="background:#f1f5f9; padding:12px; margin:10px 0; border-left:4px solid var(--primary);">${blankEx} (뜻: ${target.meaning})</blockquote>
                <input type="text" id="quizAns" placeholder="영어 단어 입력">
                <button onclick="checkAnswer('${target.word}', '${target.id}')" style="margin-top:10px;">제출</button>
            `;
        } else if (type === 'word_to_meaning') {
            const options = [target.meaning, "사려 깊은", "충동적인", "복잡한"].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <p><strong>문제:</strong> 다음 단어의 뜻을 고르세요: <b style="font-size:20px; color:var(--primary);">${target.word}</b></p>
                ${options.map(opt => `<button class="quiz-option" onclick="checkChoice('${opt}', '${target.meaning}', '${target.id}')">${opt}</button>`).join('')}
            `;
        } else {
            const options = [target.word, "candid", "meticulous", "ubiquitous"].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <p><strong>문제:</strong> 다음 뜻에 해당하는 단어를 고르세요: <b style="font-size:20px; color:var(--primary);">${target.meaning}</b></p>
                ${options.map(opt => `<button class="quiz-option" onclick="checkChoice('${opt}', '${target.word}', '${target.id}')">${opt}</button>`).join('')}
            `;
        }
    }

    function checkAnswer(correct, id) {
        const userAns = document.getElementById('quizAns').value.trim();
        if (userAns.toLowerCase() === correct.toLowerCase()) {
            alert("🎉 정답입니다!");
        } else {
            alert(`❌ 오답입니다. 정답은 [${correct}] 입니다.`);
            markWrong(id);
        }
        renderQuiz();
    }

    function checkChoice(selected, correct, id) {
        if (selected === correct) {
            alert("🎉 정답입니다!");
        } else {
            alert(`❌ 오답입니다. 정답은 [${correct}] 입니다.`);
            markWrong(id);
        }
        renderQuiz();
    }

    function markWrong(id) {
        const item = wordsDb.find(w => w.id == id);
        if (item) item.wrongCount++;
    }

    // 5단계: 복습하기
    function renderStep5() {
        const reviewList = document.getElementById('reviewList');
        const wrongWords = wordsDb.filter(w => w.wrongCount > 0);

        if (wrongWords.length === 0) {
            reviewList.innerHTML = "<p style='color:#059669; font-weight:bold;'>🎉 복습할 오답 단어가 없습니다!</p>";
            return;
        }

        reviewList.innerHTML = wrongWords.map(w => `
            <div class="word-item">
                <div>
                    <strong>${w.word}</strong> - ${w.meaning}
                    <span style="color:#ef4444; font-size:12px; margin-left:8px;">(오답 ${w.wrongCount}회)</span>
                </div>
                <button onclick="clearWrong('${w.id}')" style="background:#059669; padding:6px 12px; font-size:12px;">복습 완료</button>
            </div>
        `).join('');
    }

    function clearWrong(id) {
        const item = wordsDb.find(w => w.id == id);
        if (item) item.wrongCount = 0;
        renderStep5();
    }
</script>
</body>
</html>
