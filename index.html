<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOCA MASTER - AI 단어장</title>
    <style>
        /* 다크모드 및 아이폰 선택 하이라이트 방지 */
        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        input, textarea, select {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #18181b inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        body {
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: #121212;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #27272a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            background: #18181b;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #27272a;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #71717a;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #6366f1;
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        h2 { font-size: 16px; margin-bottom: 10px; font-weight: 700; color: #f4f4f5; }
        p, label { font-size: 13px; color: #a1a1aa; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; }

        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            appearance: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #6366f1 !important;
        }

        button.btn-primary {
            width: 100%;
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        button.btn-primary:active { background-color: #4f46e5; }

        .card-box {
            border: 1px solid #27272a;
            border-radius: 14px;
            padding: 30px 16px;
            text-align: center;
            margin: 14px 0;
            background: #18181b;
            cursor: pointer;
        }

        .card-title { font-size: 24px; font-weight: 800; color: #818cf8; margin-bottom: 6px; }
        .card-sub { font-size: 16px; color: #34d399; display: none; margin-top: 10px; }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .btn-delete {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-delete:active { background: #dc2626; }

        .loading {
            display: none;
            text-align: center;
            color: #818cf8;
            font-size: 12px;
            margin-top: 6px;
        }

        .ai-badge {
            background: #6366f1;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VOCA MASTER</h1>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchStep(1)">1. 등록</button>
        <button class="tab-btn" onclick="switchStep(2)">2. 뜻/설정</button>
        <button class="tab-btn" onclick="switchStep(3)">3. 학습</button>
        <button class="tab-btn" onclick="switchStep(4)">4. 테스트</button>
        <button class="tab-btn" onclick="switchStep(5)">🔁 복습</button>
    </div>

    <!-- 1단계 -->
    <div id="step1" class="step-panel active">
        <h2>📥 1단계: 단어 등록</h2>
        <p style="margin-bottom: 10px;">영어 단어만 입력하면 한글 뜻을 자동으로 채워줍니다.</p>
        <div class="form-group">
            <textarea id="wordInput" rows="4" placeholder="영어 단어를 입력하세요&#10;예: apple, banana&#10;resilience"></textarea>
            <div id="loadingText" class="loading">⚡ 뜻 자동 번역 중...</div>
        </div>
        <button class="btn-primary" onclick="addWords()">단어 등록하기</button>
    </div>

    <!-- 2단계 (삭제 버튼 추가됨) -->
    <div id="step2" class="step-panel">
        <h2>⚙️ 2단계: 뜻 확인 및 설정</h2>
        <div id="editWordList" style="margin-bottom: 20px; max-height: 220px; overflow-y: auto;"></div>

        <h2>🤖 AI 채점 설정 (선택사항)</h2>
        <div class="form-group" style="margin-top: 8px;">
            <label>Gemini API Key</label>
            <input type="text" id="apiKeyInput" placeholder="발급받으신 AI 키 입력">
        </div>

        <h2>학습 방식 설정</h2>
        <div class="form-group">
            <select id="studyModeSelect" onchange="toggleModeOptions()">
                <option value="card">단어 카드로 학습</option>
                <option value="example">예문으로 학습</option>
            </select>
        </div>

        <div id="cardOptions" class="form-group">
            <label>카드 제시 방식</label>
            <select id="cardDirection">
                <option value="word_first">앞: 단어 / 뒤: 뜻</option>
                <option value="meaning_first">앞: 뜻 / 뒤: 단어</option>
                <option value="random">랜덤 (무작위)</option>
            </select>
        </div>

        <div id="exampleOptions" class="form-group" style="display: none;">
            <label>예문 1개당 단어 수 (1~3개)</label>
            <input type="number" id="wordsPerSentence" min="1" max="3" value="1">
        </div>
    </div>

    <!-- 3단계 -->
    <div id="step3" class="step-panel">
        <h2>📖 3단계: 단어 학습</h2>
        <div id="studyContainer"></div>
    </div>

    <!-- 4단계 -->
    <div id="step4" class="step-panel">
        <h2>📝 4단계: 주관식 테스트</h2>
        <div class="form-group" style="margin-top: 10px;">
            <select id="quizTypeSelect" onchange="renderQuiz()">
                <option value="word_to_meaning">1. 단어 보고 뜻 맞추기 (AI 자동채점) ✨</option>
                <option value="meaning_to_word">2. 뜻 보고 단어 맞추기 (주관식)</option>
                <option value="blank">3. 문장 빈칸 채우기 (주관식)</option>
            </select>
        </div>
        <div id="quizContainer" style="margin-top: 16px;"></div>
    </div>

    <!-- 5단계 -->
    <div id="step5" class="step-panel">
        <h2>🔁 내 단어장 & 오답 복습</h2>
        <div id="reviewList" style="margin-top: 10px;"></div>
    </div>
</div>

<script>
    let wordsDb = [
        { id: 1, word: "resilience", meaning: "회복력, 탄력성", example: "She showed resilience in tough times.", wrongCount: 1 },
        { id: 2, word: "meticulous", meaning: "꼼꼼한, 세심한", example: "He is meticulous about his work.", wrongCount: 0 }
    ];

    function switchStep(stepNum) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === stepNum - 1);
        });
        document.querySelectorAll('.step-panel').forEach((panel, idx) => {
            panel.classList.toggle('active', idx === stepNum - 1);
        });

        if (stepNum === 2) renderStep2();
        if (stepNum === 3) renderStep3();
        if (stepNum === 4) renderQuiz();
        if (stepNum === 5) renderStep5();
    }

    async function fetchKoreanMeaning(word) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ko`);
            const data = await res.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (e) {}
        return "뜻 확인 필요";
    }

    async function addWords() {
        const text = document.getElementById('wordInput').value.trim();
        if (!text) return alert("단어를 입력해주세요.");

        document.getElementById('loadingText').style.display = 'block';
        const rawList = text.replace(/,/g, '\n').split('\n');
        let addedCount = 0;

        for (let w of rawList) {
            w = w.trim();
            if (w && !wordsDb.some(item => item.word.toLowerCase() === w.toLowerCase())) {
                const autoMeaning = await fetchKoreanMeaning(w);
                wordsDb.push({
                    id: Date.now() + Math.random(),
                    word: w,
                    meaning: autoMeaning,
                    example: `This is an example sentence using ${w}.`,
                    wrongCount: 0
                });
                addedCount++;
            }
        }

        document.getElementById('loadingText').style.display = 'none';
        alert(`${addedCount}개 단어가 등록되었습니다!`);
        document.getElementById('wordInput').value = "";
    }

    // 2단계: 단어 및 뜻 확인 + 삭제 기능
    function renderStep2() {
        const listDiv = document.getElementById('editWordList');

        if (wordsDb.length === 0) {
            listDiv.innerHTML = "<p style='text-align:center; padding:12px; color:#71717a;'>등록된 단어가 없습니다.</p>";
            return;
        }

        listDiv.innerHTML = wordsDb.map((item, idx) => `
            <div class="word-item">
                <strong style="color:#818cf8; width: 30%; font-size:13px; overflow:hidden; text-overflow:ellipsis;">${item.word}</strong>
                <input type="text" value="${item.meaning}" style="width: 50%;" onchange="wordsDb[${idx}].meaning = this.value">
                <button class="btn-delete" onclick="deleteWord(${item.id})">삭제</button>
            </div>
        `).join('');
    }

    function deleteWord(id) {
        wordsDb = wordsDb.filter(item => item.id !== id);
        renderStep2();
    }

    function toggleModeOptions() {
        const mode = document.getElementById('studyModeSelect').value;
        document.getElementById('cardOptions').style.display = mode === 'card' ? 'block' : 'none';
        document.getElementById('exampleOptions').style.display = mode === 'example' ? 'block' : 'none';
    }

    function renderStep3() {
        const mode = document.getElementById('studyModeSelect').value;
        const container = document.getElementById('studyContainer');

        if (wordsDb.length === 0) {
            container.innerHTML = "<p style='text-align:center; padding:20px; color:#71717a;'>학습할 단어가 없습니다. 1단계에서 단어를 올려주세요.</p>";
            return;
        }

        if (mode === 'card') {
            const dir = document.getElementById('cardDirection').value;
            container.innerHTML = wordsDb.map(item => {
                let front = item.word, back = item.meaning;
                if (dir === 'meaning_first' || (dir === 'random' && Math.random() > 0.5)) {
                    front = item.meaning; back = item.word;
                }
                return `
                    <div class="card-box" onclick="this.querySelector('.card-sub').style.display = 'block'">
                        <div class="card-title">${front}</div>
                        <div class="card-sub">${back}<br><span style="font-size:12px; color:#a1a1aa;">${item.example}</span></div>
                        <p style="font-size: 11px; color: #71717a; margin-top: 10px;">(탭하여 뒷면 확인)</p>
                    </div>
                `;
            }).join('');
        } else {
            const num = parseInt(document.getElementById('wordsPerSentence').value) || 1;
            let html = "";
            for (let i = 0; i < wordsDb.length; i += num) {
                const chunk = wordsDb.slice(i, i + num);
                const wordsStr = chunk.map(w => `<b style="color:#818cf8">${w.word}</b>(${w.meaning})`).join(', ');
                const exStr = chunk.map(w => w.example).join(' ');
                html += `
                    <div style="background:#18181b; border:1px solid #27272a; padding:14px; border-radius:10px; margin-bottom:10px;">
                        <p style="margin-bottom:6px;">🔑 <strong>단어:</strong> ${wordsStr}</p>
                        <p>📖 <strong>예문:</strong> ${exStr}</p>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
    }

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        if (wordsDb.length === 0) {
            container.innerHTML = "<p style='text-align:center; padding:20px; color:#71717a;'>테스트할 단어가 없습니다.</p>";
            return;
        }

        const type = document.getElementById('quizTypeSelect').value;
        const target = wordsDb[Math.floor(Math.random() * wordsDb.length)];

        if (type === 'word_to_meaning') {
            container.innerHTML = `
                <p><strong>문제:</strong> 아래 단어의 한글 뜻을 작성하세요. <span class="ai-badge">AI 채점</span></p>
                <div style="font-size:24px; font-weight:800; color:#818cf8; margin:16px 0; text-align:center;">${target.word}</div>
                <input type="text" id="quizAns" placeholder="한글 뜻 입력 (예: 회복하는 능력)" style="margin-bottom:10px;">
                <button class="btn-primary" id="submitBtn" onclick="checkMeaningAI('${target.word}', '${target.meaning}', '${target.id}')">AI 정답 확인</button>
                <div id="aiLoading" class="loading">🤖 AI가 의미 일치 여부를 평가하고 있습니다...</div>
            `;
        } else if (type === 'meaning_to_word') {
            container.innerHTML = `
                <p><strong>문제:</strong> 아래 뜻에 해당하는 영어 단어를 작성하세요.</p>
                <div style="font-size:20px; font-weight:700; color:#34d399; margin:16px 0; text-align:center;">${target.meaning}</div>
                <input type="text" id="quizAns" placeholder="영어 단어 입력" style="margin-bottom:10px;">
                <button class="btn-primary" onclick="checkExactAnswer('${target.word}', '${target.id}')">정답 제출</button>
            `;
        } else {
            const blankEx = target.example.replace(new RegExp(target.word, 'gi'), "_______");
            container.innerHTML = `
                <p><strong>문제:</strong> 문장 빈칸에 들어갈 영어 단어를 작성하세요.</p>
                <div style="background:#18181b; padding:14px; margin:12px 0; border-radius:8px; border-left:3px solid #6366f1;">
                    "${blankEx}"<br><span style="font-size:12px; color:#a1a1aa;">(뜻: ${target.meaning})</span>
                </div>
                <input type="text" id="quizAns" placeholder="영어 단어 입력" style="margin-bottom:10px;">
                <button class="btn-primary" onclick="checkExactAnswer('${target.word}', '${target.id}')">정답 제출</button>
            `;
        }
    }

    async function checkMeaningAI(word, correctMeaning, id) {
        const userAns = document.getElementById('quizAns').value.trim();
        if (!userAns) return alert("뜻을 입력해주세요.");

        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const loading = document.getElementById('aiLoading');
        const submitBtn = document.getElementById('submitBtn');
        
        loading.style.display = 'block';
        submitBtn.disabled = true;

        let isCorrect = false;

        if (apiKey) {
            try {
                const prompt = `영어 단어 "${word}"의 표준 뜻은 "${correctMeaning}"입니다. 사용자가 입력한 뜻 "${userAns}"가 유효하거나 일치하면 "CORRECT", 완전히 틀리면 "INCORRECT"만 출력하세요.`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const resultText = data.candidates[0].content.parts[0].text.trim();
                isCorrect = resultText.includes("CORRECT");
            } catch (err) {
                isCorrect = checkBasicMatch(userAns, correctMeaning);
            }
        } else {
            isCorrect = checkBasicMatch(userAns, correctMeaning);
        }

        loading.style.display = 'none';
        submitBtn.disabled = false;

        if (isCorrect) {
            alert(`🎉 정답입니다!\n(입력: ${userAns} / 사전 뜻: ${correctMeaning})`);
        } else {
            alert(`❌ 오답입니다.\n사전 뜻: [${correctMeaning}]`);
            markWrong(id);
        }
        renderQuiz();
    }

    function checkBasicMatch(userAns, correctMeaning) {
        const keywords = correctMeaning.split(/[,/ ]+/).filter(k => k.length > 0);
        return keywords.some(kw => userAns.includes(kw) || kw.includes(userAns));
    }

    function checkExactAnswer(correct, id) {
        const userAns = document.getElementById('quizAns').value.trim();
        if (userAns.toLowerCase() === correct.toLowerCase()) {
            alert("🎉 정답입니다!");
        } else {
            alert(`❌ 오답입니다. 정답은 [${correct}] 입니다.`);
            markWrong(id);
        }
        renderQuiz();
    }

    function markWrong(id) {
        const item = wordsDb.find(w => w.id == id);
        if (item) item.wrongCount++;
    }

    function renderStep5() {
        const reviewList = document.getElementById('reviewList');
        const wrongWords = wordsDb.filter(w => w.wrongCount > 0);

        if (wrongWords.length === 0) {
            reviewList.innerHTML = "<p style='color:#34d399; font-weight:bold; text-align:center; padding:20px;'>🎉 복습할 오답 단어가 없습니다!</p>";
            return;
        }

        reviewList.innerHTML = wrongWords.map(w => `
            <div class="word-item">
                <div>
                    <strong>${w.word}</strong> - <span style="color:#a1a1aa;">${w.meaning}</span>
                    <span style="color:#ef4444; font-size:12px;">(오답 ${w.wrongCount}회)</span>
                </div>
                <button onclick="clearWrong('${w.id}')" style="background:#34d399; color:#000; border:none; padding:6px 10px; border-radius:6px; font-weight:bold; font-size:12px;">완료</button>
            </div>
        `).join('');
    }

    function clearWrong(id) {
        const item = wordsDb.find(w => w.id == id);
        if (item) item.wrongCount = 0;
        renderStep5();
    }
</script>
</body>
</html>
