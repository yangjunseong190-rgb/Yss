<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단어 학습 도우미</title>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #121212;
            --bg-input: #1a1a1a;
            --border: #2a2a2a;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --success: #10b981;
        }

        /* 아이폰 파란색 박스/터치 하이라이트 및 선택 방지 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
        }

        /* 텍스트 드래그 박스 선택 방지 (입력창 제외) */
        body, button, .nav-tab, .card-box, .quiz-opt {
            -webkit-user-select: none;
            user-select: none;
        }

        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        /* 네비게이션 탭 */
        .nav-bar {
            display: flex;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            gap: 2px;
        }

        .nav-tab {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-tab.active {
            background: var(--bg-input);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* 콘텐츠 패널 */
        .panel { display: none; }
        .panel.active { display: block; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text-main);
        }

        /* 폼 요소 */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }

        input[type="text"], textarea, select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--accent);
        }

        button.btn-primary {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-primary:active {
            background: var(--accent-hover);
        }

        /* 단어 카드 학습 UI */
        .flashcard {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            margin: 16px 0;
            transition: transform 0.1s active;
        }

        .flashcard:active { transform: scale(0.98); }
        .word-main { font-size: 26px; font-weight: 700; color: var(--text-main); }
        .word-sub { font-size: 18px; color: var(--success); margin-top: 12px; display: none; }

        /* 단어 항목 리스트 */
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .word-item:last-child { border-bottom: none; }

        /* 로딩 애니메이션 */
        .loading {
            display: none;
            text-align: center;
            font-size: 13px;
            color: var(--accent);
            margin-top: 10px;
        }

        /* 퀴즈 옵션 버튼 */
        .quiz-opt {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }
        .quiz-opt:active { background: var(--border); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VOCABULARY</h1>
    </header>

    <!-- 네비게이션 탭 -->
    <div class="nav-bar">
        <button class="nav-tab active" onclick="setTab(1)">등록</button>
        <button class="nav-tab" onclick="setTab(2)">설정</button>
        <button class="nav-tab" onclick="setTab(3)">학습</button>
        <button class="nav-tab" onclick="setTab(4)">테스트</button>
        <button class="nav-tab" onclick="setTab(5)">복습</button>
    </div>

    <!-- 1단계: 단어 등록 -->
    <div id="p1" class="panel active">
        <div class="card">
            <div class="card-title">1단계: 단어 등록</div>
            <div class="form-group">
                <label>영어 단어 입력 (줄바꿈/쉼표로 다건 입력 가능)</label>
                <textarea id="wordInput" rows="4" placeholder="apple&#10;resilience, meticulous"></textarea>
            </div>
            <button class="btn-primary" onclick="registerWords()">단어 등록 (뜻 자동 생성)</button>
            <div id="loadStatus" class="loading">⚡ 뜻을 자동으로 번역하여 채우는 중...</div>
        </div>
    </div>

    <!-- 2단계: 뜻 검토 및 설정 -->
    <div id="p2" class="panel">
        <div class="card">
            <div class="card-title">단어 목록 및 뜻 수정</div>
            <div id="wordEditList"></div>
        </div>

        <div class="card">
            <div class="card-title">학습 옵션 설정</div>
            <div class="form-group">
                <label>학습 모드</label>
                <select id="modeSelect" onchange="toggleMode()">
                    <option value="card">단어 카드로 학습</option>
                    <option value="example">예문으로 학습</option>
                </select>
            </div>
            <div id="cardOptGroup" class="form-group">
                <label>카드 제시 방식</label>
                <select id="cardDir">
                    <option value="w_f">앞: 단어 / 뒤: 뜻</option>
                    <option value="m_f">앞: 뜻 / 뒤: 단어</option>
                    <option value="rand">랜덤 (무작위)</option>
                </select>
            </div>
            <div id="exOptGroup" class="form-group" style="display:none;">
                <label>예문 1개당 단어 수</label>
                <input type="number" id="wordsPerEx" value="1" min="1" max="3">
            </div>
        </div>
    </div>

    <!-- 3단계: 단어 학습 -->
    <div id="p3" class="panel">
        <div id="studyArea"></div>
    </div>

    <!-- 4단계: 테스트 -->
    <div id="p4" class="panel">
        <div class="card">
            <div class="card-title">테스트 유형</div>
            <select id="quizType" onchange="renderQuiz()">
                <option value="blank">1. 문장 속 빈칸 채우기</option>
                <option value="w2m">2. 객관식: 단어 ➔ 뜻</option>
                <option value="m2w">3. 객관식: 뜻 ➔ 단어</option>
            </select>
        </div>
        <div id="quizArea"></div>
    </div>

    <!-- 5단계: 복습하기 -->
    <div id="p5" class="panel">
        <div class="card">
            <div class="card-title">복습 필요한 오답 단어</div>
            <div id="reviewList"></div>
        </div>
    </div>
</div>

<script>
    let db = [
        { id: 1, word: "resilience", meaning: "회복력", example: "She showed resilience in tough times.", wrong: 1 },
        { id: 2, word: "meticulous", meaning: "꼼꼼한", example: "He is meticulous about his work.", wrong: 0 }
    ];

    function setTab(num) {
        document.querySelectorAll('.nav-tab').forEach((t, i) => t.classList.toggle('active', i === num - 1));
        document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === num - 1));

        if (num === 2) renderP2();
        if (num === 3) renderP3();
        if (num === 4) renderQuiz();
        if (num === 5) renderP5();
    }

    // 마이메모리 번역 API 이용 뜻 자동 추출
    async function fetchMeaning(word) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ko`);
            const data = await res.json();
            if (data && data.responseData && data.responseData.translatedText) {
                let text = data.responseData.translatedText;
                if (!text.includes("MYMEMORY")) return text;
            }
        } catch (e) {}
        return "뜻 확인 필요";
    }

    async function registerWords() {
        const input = document.getElementById('wordInput').value.trim();
        if (!input) return alert("단어를 입력하세요.");

        const status = document.getElementById('loadStatus');
        status.style.display = 'block';

        const words = input.replace(/,/g, '\n').split('\n').map(w => w.trim()).filter(w => w);

        for (let w of words) {
            if (!db.some(item => item.word.toLowerCase() === w.toLowerCase())) {
                const autoMeaning = await fetchMeaning(w);
                db.push({
                    id: Date.now() + Math.random(),
                    word: w,
                    meaning: autoMeaning,
                    example: `This sentence features the word ${w}.`,
                    wrong: 0
                });
            }
        }

        status.style.display = 'none';
        document.getElementById('wordInput').value = '';
        alert("단어가 추가되었으며 뜻이 자동으로 등록되었습니다!");
    }

    function renderP2() {
        const list = document.getElementById('wordEditList');
        list.innerHTML = db.map((item, idx) => `
            <div class="word-item">
                <span style="font-weight:600; width:35%;">${item.word}</span>
                <input type="text" value="${item.meaning}" style="width:60%;" onchange="db[${idx}].meaning=this.value">
            </div>
        `).join('');
    }

    function toggleMode() {
        const m = document.getElementById('modeSelect').value;
        document.getElementById('cardOptGroup').style.display = m === 'card' ? 'block' : 'none';
        document.getElementById('exOptGroup').style.display = m === 'example' ? 'block' : 'none';
    }

    function renderP3() {
        const area = document.getElementById('studyArea');
        const mode = document.getElementById('modeSelect').value;

        if (mode === 'card') {
            const dir = document.getElementById('cardDir').value;
            area.innerHTML = db.map(item => {
                let front = item.word, back = item.meaning;
                if (dir === 'm_f' || (dir === 'rand' && Math.random() > 0.5)) {
                    front = item.meaning; back = item.word;
                }
                return `
                    <div class="flashcard" onclick="this.querySelector('.word-sub').style.display='block'">
                        <div class="word-main">${front}</div>
                        <div class="word-sub">${back}<br><span style="font-size:12px; color:var(--text-sub);">${item.example}</span></div>
                    </div>
                `;
            }).join('');
        } else {
            const num = parseInt(document.getElementById('wordsPerEx').value) || 1;
            let html = "";
            for (let i = 0; i < db.length; i += num) {
                const chunk = db.slice(i, i + num);
                const wStr = chunk.map(w => `<b style="color:var(--accent);">${w.word}</b>(${w.meaning})`).join(', ');
                const exStr = chunk.map(w => w.example).join(' ');
                html += `
                    <div class="card">
                        <div style="font-size:13px; color:var(--text-sub); margin-bottom:6px;">단어: ${wStr}</div>
                        <div style="font-size:15px; font-weight:500;">📖 ${exStr}</div>
                    </div>
                `;
            }
            area.innerHTML = html;
        }
    }

    function renderQuiz() {
        if (db.length === 0) return;
        const type = document.getElementById('quizType').value;
        const area = document.getElementById('quizArea');
        const target = db[Math.floor(Math.random() * db.length)];

        if (type === 'blank') {
            const blankEx = target.example.replace(new RegExp(target.word, 'gi'), "_______");
            area.innerHTML = `
                <div class="card">
                    <label>빈칸에 들어갈 단어 입력</label>
                    <div style="margin: 12px 0; font-size:15px;">"${blankEx}"</div>
                    <div style="color:var(--text-sub); font-size:12px; margin-bottom:12px;">뜻: ${target.meaning}</div>
                    <input type="text" id="qAns" placeholder="영어 단어">
                    <button class="btn-primary" onclick="checkAnswer('${target.word}', ${target.id})" style="margin-top:10px;">제출</button>
                </div>
            `;
        } else if (type === 'w2m') {
            const opts = [target.meaning, "사려 깊은", "충동적인", "복잡한"].sort(() => Math.random() - 0.5);
            area.innerHTML = `
                <div class="card">
                    <label>단어의 뜻을 선택하세요</label>
                    <div style="font-size:22px; font-weight:700; color:var(--accent); margin:10px 0;">${target.word}</div>
                    ${opts.map(o => `<button class="quiz-opt" onclick="checkChoice('${o}', '${target.meaning}', ${target.id})">${o}</button>`).join('')}
                </div>
            `;
        } else {
            const opts = [target.word, "candid", "meticulous", "ubiquitous"].sort(() => Math.random() - 0.5);
            area.innerHTML = `
                <div class="card">
                    <label>뜻에 해당하는 단어를 선택하세요</label>
                    <div style="font-size:22px; font-weight:700; color:var(--accent); margin:10px 0;">${target.meaning}</div>
                    ${opts.map(o => `<button class="quiz-opt" onclick="checkChoice('${o}', '${target.word}', ${target.id})">${o}</button>`).join('')}
                </div>
            `;
        }
    }

    function checkAnswer(correct, id) {
        const val = document.getElementById('qAns').value.trim();
        if (val.toLowerCase() === correct.toLowerCase()) alert("🎉 정답입니다!");
        else { alert(`❌ 오답입니다. 정답: [${correct}]`); addWrong(id); }
        renderQuiz();
    }

    function checkChoice(sel, correct, id) {
        if (sel === correct) alert("🎉 정답입니다!");
        else { alert(`❌ 오답입니다. 정답: [${correct}]`); addWrong(id); }
        renderQuiz();
    }

    function addWrong(id) {
        const item = db.find(w => w.id === id);
        if (item) item.wrong++;
    }

    function renderP5() {
        const list = document.getElementById('reviewList');
        const wrongList = db.filter(w => w.wrong > 0);

        if (wrongList.length === 0) {
            list.innerHTML = `<p style="color:var(--success); text-align:center;">🎉 오답 단어가 없습니다!</p>`;
            return;
        }

        list.innerHTML = wrongList.map(w => `
            <div class="word-item">
                <div>
                    <strong>${w.word}</strong> <span style="color:var(--text-sub); font-size:13px;">(${w.meaning})</span>
                </div>
                <button onclick="clearWrong(${w.id})" style="background:var(--success); border:none; color:white; padding:6px 12px; border-radius:6px; font-size:12px;">완료</button>
            </div>
        `).join('');
    }

    function clearWrong(id) {
        const item = db.find(w => w.id === id);
        if (item) item.wrong = 0;
        renderP5();
    }
</script>
</body>
</html>
