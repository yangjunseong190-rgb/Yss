<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOCA MASTER - AI 예문 & 콜로케이션 학습기</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        input, textarea, select {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        body {
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 580px;
            width: 100%;
            background: #121212;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #27272a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: #18181b;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #27272a;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 4px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #71717a;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #6366f1;
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        h2 { font-size: 16px; margin-bottom: 10px; font-weight: 700; color: #f4f4f5; }
        p, label { font-size: 13px; color: #a1a1aa; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; }

        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            appearance: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #6366f1 !important;
        }

        button.btn-primary {
            width: 100%;
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        button.btn-primary:active { background-color: #4f46e5; }

        .file-box {
            background: #18181b;
            border: 2px dashed #27272a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .file-box input[type="file"] { display: none; }

        .btn-file {
            display: inline-block;
            background: #27272a;
            color: #818cf8;
            border: 1px solid #3f3f46;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin: 4px;
        }

        .word-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .word-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .btn-action {
            background: #27272a;
            color: #818cf8;
            border: 1px solid #3f3f46;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-delete {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .collo-box {
            margin-top: 8px;
            padding: 8px 10px;
            background: #09090b;
            border-radius: 6px;
            border-left: 3px solid #818cf8;
            font-size: 12px;
            color: #34d399;
            display: none;
            white-space: pre-line;
        }

        .loading {
            display: none;
            text-align: center;
            color: #818cf8;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ AI 예문 & 표현 학습기</h1>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchStep(1)">1. 단어 등록</button>
        <button class="tab-btn" onclick="switchStep(2)">2. 단어 관리</button>
        <button class="tab-btn" onclick="switchStep(3)">3. 스토리 예문</button>
    </div>

    <!-- 1단계: 단어 등록 -->
    <div id="step1" class="step-panel active">
        <h2>📥 1단계: 단어 추가</h2>
        
        <div class="file-box">
            <p style="margin-bottom: 8px; font-weight: bold; color: #f4f4f5;">📄 파일 및 📷 사진으로 등록</p>
            <label class="btn-file">
                📄 텍스트 파일 (.txt) 선택
                <input type="file" id="txtFile" accept=".txt" onchange="handleTxtFile(event)">
            </label>
            <label class="btn-file">
                📷 단어 사진/이미지 선택
                <input type="file" id="imgFile" accept="image/*" onchange="handleImgFile(event)">
            </label>
            <div id="ocrStatus" style="font-size: 11px; color: #818cf8; margin-top: 6px; display: none;">AI가 유용한 단어만 정제하는 중...</div>
        </div>

        <p style="margin-bottom: 8px;">직접 입력하기:</p>
        <div class="form-group">
            <textarea id="wordInput" rows="5" placeholder="영어 단어를 입력하세요 (줄바꿈 또는 쉼표 구분)&#10;예: resilience, meticulous, persistent, adapt, overcome"></textarea>
            <div id="loadingText" class="loading">⚡ 뜻 자동 번역 중...</div>
        </div>
        <button class="btn-primary" onclick="addWords()">단어 등록하기</button>
    </div>

    <!-- 2단계: 단어 관리 & 콜로케이션 -->
    <div id="step2" class="step-panel">
        <h2>⚙️ 2단계: 단어 수정 및 자주 쓰이는 표현</h2>
        <div id="editWordList" style="margin-bottom: 20px; max-height: 280px; overflow-y: auto;"></div>

        <h2>🔑 Gemini API Key</h2>
        <div class="form-group">
            <input type="text" id="apiKeyInput" placeholder="발급받은 Gemini API 키 입력">
            <p style="font-size: 11px; color: #71717a; margin-top: 4px;">* 키는 브라우저에 자동 저장되며 다음 접속 시 다시 입력하지 않으셔도 됩니다.</p>
        </div>
    </div>

    <!-- 3단계: 스토리 예문 생성 -->
    <div id="step3" class="step-panel">
        <h2>📖 3단계: 스토리형 예문 생성</h2>
        <p style="margin-bottom: 14px;">단어들이 서로 이어지는 하나 임팩트 있는 스토리를 만듭니다.</p>
        
        <div class="form-group">
            <label>한 문장당 조합할 단어 수 (최대 5개)</label>
            <select id="wordsPerSentence">
                <option value="3">한 문장당 3개 조합</option>
                <option value="4">한 문장당 4개 조합</option>
                <option value="5" selected>한 문장당 5개 조합 (추천)</option>
                <option value="1">단어 1개씩 각각 예문 생성</option>
            </select>
        </div>

        <button class="btn-primary" id="genBtn" onclick="generateExamples()">✨ 스토리 예문 만들기</button>
        <div id="aiLoading" class="loading">🤖 AI가 단어들을 연결하여 스토리 예문을 작성 중입니다...</div>

        <div id="exampleResult" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    let wordsDb = [
        { id: 1, word: "resilience", meaning: "회복력, 탄력성", collo: "" },
        { id: 2, word: "meticulous", meaning: "꼼꼼한, 세심한", collo: "" },
        { id: 3, word: "persistent", meaning: "끈기 있는, 지속적인", collo: "" }
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('voca_gemini_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        } else {
            promptApiKey();
        }

        document.getElementById('apiKeyInput').addEventListener('input', (e) => {
            localStorage.setItem('voca_gemini_key', e.target.value.trim());
        });
    });

    function promptApiKey() {
        const key = prompt("Gemini API Key를 입력해주세요.\n(입력한 키는 브라우저에 자동 저장되어 매번 입력하지 않아도 됩니다):");
        if (key) {
            const cleanKey = key.trim();
            localStorage.setItem('voca_gemini_key', cleanKey);
            document.getElementById('apiKeyInput').value = cleanKey;
        }
    }

    function switchStep(stepNum) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === stepNum - 1);
        });
        document.querySelectorAll('.step-panel').forEach((panel, idx) => {
            panel.classList.toggle('active', idx === stepNum - 1);
        });

        if (stepNum === 2) renderStep2();
    }

    // 1차 JS 정제 + 2차 AI 필터링
    async function cleanWordsWithAI(rawText) {
        // 1차 필터링: 순수 영문 알파벳으로 이루어진 3글자 이상 단어만 자바스크립트로 추출 (한국어, 숫자, 1~2글자 제거)
        const matched = rawText.match(/[a-zA-Z]+/g);
        if (!matched) return "";
        
        const firstPass = [...new Set(matched.filter(w => w.length >= 3))].join(', ');
        if (!firstPass) return "";

        const apiKey = localStorage.getItem('voca_gemini_key') || document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) return firstPass;

        // 2차 필터링: AI를 이용해 사람 이름, 지명, 오탈자, 특수 단어 제외
        try {
            const prompt = `다음 영단어 목록에서 사람 이름(John, Mary 등), 도시/나라 이름, 의미 없는 철자 오류를 제외하고, '실제 학습용 일반 영어 단어'만 남겨서 쉼표(,)로 구분해 출력해줘. 다른 설명은 절대 하지 마.

목록: ${firstPass}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                return data.candidates[0].content.parts[0].text.replace(/\n/g, '').trim();
            }
        } catch (e) {
            console.error(e);
        }
        return firstPass;
    }

    async function handleTxtFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const status = document.getElementById('ocrStatus');
        status.style.display = 'block';
        status.innerText = "⚡ AI가 파일 내용에서 영단어를 정제 중입니다...";

        const reader = new FileReader();
        reader.onload = async function(e) {
            const content = e.target.result;
            const cleanedWords = await cleanWordsWithAI(content);
            const inputArea = document.getElementById('wordInput');
            inputArea.value = inputArea.value ? inputArea.value + '\n' + cleanedWords : cleanedWords;
            status.style.display = 'none';
            alert("파일에서 유용한 영단어만 추출했습니다!");
        };
        reader.readAsText(file);
    }

    async function handleImgFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const status = document.getElementById('ocrStatus');
        status.style.display = 'block';
        status.innerText = "⚡ 1/2단계: 이미지에서 글자 읽는 중...";

        try {
            const result = await Tesseract.recognize(file, 'eng');
            const extractedText = result.data.text;
            
            status.innerText = "⚡ 2/2단계: AI가 불필요한 단어를 걸러내는 중...";
            const cleanedWords = await cleanWordsWithAI(extractedText);
            
            const inputArea = document.getElementById('wordInput');
            inputArea.value = inputArea.value ? inputArea.value + '\n' + cleanedWords : cleanedWords;
            alert("사진속 글자 중 유용한 영단어만 추출했습니다!");
        } catch (e) {
            alert("이미지 처리 중 오류가 발생했습니다.");
        } finally {
            status.style.display = 'none';
        }
    }

    async function fetchKoreanMeaning(word) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ko`);
            const data = await res.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (e) {}
        return "뜻 직접 입력";
    }

    async function addWords() {
        const text = document.getElementById('wordInput').value.trim();
        if (!text) return alert("단어를 입력하거나 파일/사진을 선택해주세요.");

        document.getElementById('loadingText').style.display = 'block';
        const rawList = text.replace(/,/g, '\n').split('\n');
        let addedCount = 0;

        for (let w of rawList) {
            w = w.trim();
            if (w && !wordsDb.some(item => item.word.toLowerCase() === w.toLowerCase())) {
                const autoMeaning = await fetchKoreanMeaning(w);
                wordsDb.push({
                    id: Date.now() + Math.random(),
                    word: w,
                    meaning: autoMeaning,
                    collo: ""
                });
                addedCount++;
            }
        }

        document.getElementById('loadingText').style.display = 'none';
        alert(`${addedCount}개 단어가 등록되었습니다!`);
        document.getElementById('wordInput').value = "";
        switchStep(2);
    }

    function renderStep2() {
        const listDiv = document.getElementById('editWordList');

        if (wordsDb.length === 0) {
            listDiv.innerHTML = "<p style='text-align:center; padding:12px; color:#71717a;'>등록된 단어가 없습니다.</p>";
            return;
        }

        listDiv.innerHTML = wordsDb.map((item, idx) => `
            <div class="word-card">
                <div class="word-row">
                    <strong style="color:#818cf8; width: 28%; font-size:13px; overflow:hidden; text-overflow:ellipsis;">${item.word}</strong>
                    <input type="text" value="${item.meaning}" style="width: 42%;" onchange="wordsDb[${idx}].meaning = this.value">
                    <button class="btn-action" onclick="getCollocations(${item.id}, '${item.word}')">💡 주요 표현</button>
                    <button class="btn-delete" onclick="deleteWord(${item.id})">삭제</button>
                </div>
                <div id="collo-${item.id}" class="collo-box">${item.collo || ''}</div>
            </div>
        `).join('');

        wordsDb.forEach(item => {
            if (item.collo) {
                const box = document.getElementById(`collo-${item.id}`);
                if (box) box.style.display = 'block';
            }
        });
    }

    async function getCollocations(id, word) {
        const apiKey = localStorage.getItem('voca_gemini_key') || document.getElementById('apiKeyInput').value.trim();
        const box = document.getElementById(`collo-${id}`);
        const targetItem = wordsDb.find(w => w.id === id);

        if (box.style.display === 'block' && box.innerText.length > 0) {
            box.style.display = 'none';
            return;
        }

        box.style.display = 'block';
        box.innerText = "⚡ 자주 쓰이는 표현 찾는 중...";

        if (apiKey) {
            try {
                const prompt = `영어 단어 "${word}"와 자주 함께 쓰이는 대표적인 연어/자주 쓰이는 표현(Collocation) 3가지를 한국어 뜻과 함께 아주 간결하게 리스트로 작성해줘.`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                targetItem.collo = text;
                box.innerText = text;
            } catch (err) {
                box.innerText = "표현을 가져오는 중 오류가 발생했습니다.";
            }
        } else {
            promptApiKey();
        }
    }

    function deleteWord(id) {
        wordsDb = wordsDb.filter(item => item.id !== id);
        renderStep2();
    }

    async function generateExamples() {
        if (wordsDb.length === 0) return alert("예문을 만들 단어가 없습니다. 1단계에서 단어를 올려주세요.");

        const apiKey = localStorage.getItem('voca_gemini_key') || document.getElementById('apiKeyInput').value.trim();
        const comboCount = document.getElementById('wordsPerSentence').value;
        const resultDiv = document.getElementById('exampleResult');
        const loading = document.getElementById('aiLoading');
        const genBtn = document.getElementById('genBtn');

        if (!apiKey) {
            promptApiKey();
            return;
        }

        loading.style.display = 'block';
        genBtn.disabled = true;
        resultDiv.innerHTML = "";

        const wordListStr = wordsDb.map(w => `${w.word} (${w.meaning})`).join(', ');

        try {
            const prompt = `너는 "영단어 예문 학습 도우미"야.
내가 제공하는 영어 단어 목록을 활용해서 효율적으로 단어를 암기할 수 있도록 예문과 정보를 정리해 줘.

[단어 목록]
${wordListStr}

[작성 규칙]
1. 위 단어들을 한 문장당 최소 ${comboCount}개 이상씩 묶어서 자연스러운 영어 예문을 작성해 줘. 모든 단어가 최소 한 번씩은 예문에 사용되어야 해.
2. 각 문장은 문장 1, 2, 3이 따로 놀지 않고, 전체가 자연스럽게 연결되는 하나의 유기적인 스토리(단편 이야기) 형태가 되도록 흐름을 이어줘.
3. 각 문장마다 아래의 정해진 형식에 맞춰 답변해 줘. 군더더기 서론이나 결론 없이 깔끔하게 출력해 줘.

[출력 형식]
### 문장 [번호]
* **영어 예문:** (생성된 영어 문장)
* **한글 해석:** (자연스러운 한글 번역)
* **포함된 단어:**
  * 단어1: 한국어 뜻
  * 단어2: 한국어 뜻
---`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            resultDiv.innerHTML = `<div style="background:#18181b; padding:16px; border-radius:12px; border:1px solid #27272a; white-space:pre-wrap; font-size:14px; line-height:1.7;">${aiText}</div>`;
        } catch (err) {
            alert("API Key 오류 또는 요청 실패입니다.");
        }

        loading.style.display = 'none';
        genBtn.disabled = false;
    }
</script>
</body>
</html>
