<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOCA MASTER - AI 예문 & 콜로케이션 학습기 (Groq)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        input, textarea, select {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        body {
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 580px;
            width: 100%;
            background: #121212;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #27272a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .version-badge {
            font-size: 11px;
            background: #10b981;
            color: #fff;
            padding: 2px 6px;
            border-radius: 6px;
            vertical-align: middle;
            margin-left: 6px;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: #18181b;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #27272a;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 4px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #71717a;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #10b981;
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        h2 { font-size: 16px; margin-bottom: 10px; font-weight: 700; color: #f4f4f5; }
        p, label { font-size: 13px; color: #a1a1aa; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; }

        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            appearance: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #10b981 !important;
        }

        button.btn-primary {
            width: 100%;
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        button.btn-primary:active { background-color: #059669; }

        .file-box {
            background: #18181b;
            border: 2px dashed #27272a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .file-box input[type="file"] { display: none; }

        .btn-file {
            display: inline-block;
            background: #27272a;
            color: #34d399;
            border: 1px solid #3f3f46;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin: 4px;
        }

        /* 2단계 단어 카드가 개선된 스타일 */
        .word-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .word-title {
            font-size: 17px;
            font-weight: 800;
            color: #34d399;
            word-break: break-word;
            letter-spacing: -0.3px;
        }

        .word-subrow {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .word-subrow input {
            flex: 1;
            padding: 8px 10px;
            font-size: 13px;
        }

        .btn-action {
            background: #27272a;
            color: #34d399;
            border: 1px solid #3f3f46;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-delete {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .collo-box {
            margin-top: 4px;
            padding: 10px;
            background: #09090b;
            border-radius: 8px;
            border-left: 3px solid #10b981;
            font-size: 12px;
            color: #34d399;
            display: none;
            white-space: pre-line;
            line-height: 1.5;
        }

        .loading {
            display: none;
            text-align: center;
            color: #34d399;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ AI 예문 & 표현 학습기 <span class="version-badge">v3.1 (Groq)</span></h1>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchStep(1)">1. 단어 등록</button>
        <button class="tab-btn" onclick="switchStep(2)">2. 단어 관리</button>
        <button class="tab-btn" onclick="switchStep(3)">3. 스토리 예문</button>
    </div>

    <!-- 1단계: 단어 등록 -->
    <div id="step1" class="step-panel active">
        <h2>📥 1단계: 단어 추가</h2>
        
        <div class="file-box">
            <p style="margin-bottom: 8px; font-weight: bold; color: #f4f4f5;">📄 파일 및 📷 사진으로 등록</p>
            <label class="btn-file">
                📄 텍스트 파일 (.txt) 선택
                <input type="file" id="txtFile" accept=".txt" onchange="handleTxtFile(event)">
            </label>
            <label class="btn-file">
                📷 단어 사진/이미지 선택
                <input type="file" id="imgFile" accept="image/*" onchange="handleImgFile(event)">
            </label>
            <div id="ocrStatus" style="font-size: 11px; color: #34d399; margin-top: 6px; display: none;">AI가 유용한 단어만 정제하는 중...</div>
        </div>

        <p style="margin-bottom: 8px;">직접 입력하기:</p>
        <div class="form-group">
            <textarea id="wordInput" rows="5" placeholder="영어 단어를 입력하세요 (줄바꿈 또는 쉼표 구분)&#10;예: resilience, meticulous, persistent, adapt, overcome"></textarea>
            <div id="loadingText" class="loading">⚡ AI가 정확한 단어 뜻을 번역하는 중...</div>
        </div>
        <button class="btn-primary" onclick="addWords()">단어 등록하기</button>
    </div>

    <!-- 2단계: 단어 관리 & 콜로케이션 -->
    <div id="step2" class="step-panel">
        <h2>⚙️ 2단계: 단어 수정 및 주요 표현</h2>
        <div id="editWordList" style="margin-bottom: 20px; max-height: 320px; overflow-y: auto;"></div>

        <h2>🔑 Groq API Key 설정</h2>
        <div class="form-group">
            <input type="text" id="apiKeyInput" placeholder="gsk_로 시작하는 Groq API 키 입력">
            <p style="font-size: 11px; color: #71717a; margin-top: 4px;">* console.groq.com에서 무료 발급받은 키를 입력하세요.</p>
        </div>
        <button class="btn-primary" style="background:#27272a; margin-bottom:10px;" onclick="resetApiKey()">🔑 API Key 다시 입력하기</button>
    </div>

    <!-- 3단계: 스토리 예문 생성 -->
    <div id="step3" class="step-panel">
        <h2>📖 3단계: 스토리형 예문 생성</h2>
        <p style="margin-bottom: 14px;">단어들이 서로 이어지는 하나의 임팩트 있는 스토리를 만듭니다.</p>
        
        <div class="form-group">
            <label>한 문장당 조합할 단어 수</label>
            <select id="wordsPerSentence">
                <option value="2">한 문장당 2개 조합 (짧은 문장)</option>
                <option value="3" selected>한 문장당 3개 조합 (추천)</option>
                <option value="4">한 문장당 4개 조합</option>
                <option value="5">한 문장당 5개 조합</option>
                <option value="1">단어 1개씩 각각 예문 생성</option>
            </select>
        </div>

        <button class="btn-primary" id="genBtn" onclick="generateExamples()">✨ 스토리 예문 만들기</button>
        <div id="aiLoading" class="loading">🤖 초고속 Groq AI가 스토리 예문을 작성 중입니다...</div>

        <div id="exampleResult" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    let wordsDb = [
        { id: 1, word: "resilience", meaning: "회복력, 탄력성", collo: "" },
        { id: 2, word: "meticulous", meaning: "꼼꼼한, 세심한", collo: "" },
        { id: 3, word: "persistent", meaning: "끈기 있는, 지속적인", collo: "" }
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('voca_groq_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        } else {
            promptApiKey();
        }

        document.getElementById('apiKeyInput').addEventListener('input', (e) => {
            localStorage.setItem('voca_groq_key', e.target.value.trim());
        });
    });

    function promptApiKey() {
        const key = prompt("Groq API Key를 입력해주세요.\n(console.groq.com에서 무료로 발급받은 gsk_... 키):");
        if (key) {
            const cleanKey = key.trim();
            localStorage.setItem('voca_groq_key', cleanKey);
            document.getElementById('apiKeyInput').value = cleanKey;
        }
    }

    function resetApiKey() {
        localStorage.removeItem('voca_groq_key');
        document.getElementById('apiKeyInput').value = '';
        promptApiKey();
    }

    function switchStep(stepNum) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === stepNum - 1);
        });
        document.querySelectorAll('.step-panel').forEach((panel, idx) => {
            panel.classList.toggle('active', idx === stepNum - 1);
        });

        if (stepNum === 2) renderStep2();
    }

    // Groq API 호출
    async function requestGroqAPI(prompt, apiKey) {
        if (!apiKey) throw new Error("API 키가 입력되지 않았습니다. 2단계에서 Groq API 키를 입력해 주세요.");

        const candidateModels = [
            'llama-3.3-70b-versatile',
            'llama-3.1-8b-instant'
        ];

        let lastError = "";

        for (const model of candidateModels) {
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.5
                    })
                });

                const data = await response.json();

                if (response.ok && data.choices && data.choices[0].message.content) {
                    return data.choices[0].message.content;
                }

                if (data.error) {
                    lastError = data.error.message;
                }
            } catch (e) {
                lastError = e.message;
            }
        }

        throw new Error("Groq API 연결 실패: " + lastError);
    }

    // AI 단어 정제
    async function cleanWordsWithAI(rawText) {
        const matched = rawText.match(/[a-zA-Z]+/g);
        if (!matched) return "";
        
        const firstPass = [...new Set(matched.filter(w => w.length >= 3))].join(', ');
        if (!firstPass) return "";

        const apiKey = localStorage.getItem('voca_groq_key') || document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) return firstPass;

        try {
            const prompt = `다음 영단어 목록에서 사람 이름, 도시/나라 이름, 의미 없는 알파벳 조합을 제외하고 일반 영단어만 쉼표(,)로 구분해 출력해줘. 다른 설명 금지.\n\n목록: ${firstPass}`;
            return await requestGroqAPI(prompt, apiKey);
        } catch (e) {
            console.warn("AI 정제 실패:", e.message);
        }
        return firstPass;
    }

    async function handleTxtFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const status = document.getElementById('ocrStatus');
        status.style.display = 'block';
        status.innerText = "⚡ AI가 파일 내용에서 영단어를 정제 중입니다...";

        const reader = new FileReader();
        reader.onload = async function(e) {
            const content = e.target.result;
            const cleanedWords = await cleanWordsWithAI(content);
            const inputArea = document.getElementById('wordInput');
            inputArea.value = inputArea.value ? inputArea.value + '\n' + cleanedWords : cleanedWords;
            status.style.display = 'none';
            alert("파일에서 유용한 영단어만 추출했습니다!");
        };
        reader.readAsText(file);
    }

    async function handleImgFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const status = document.getElementById('ocrStatus');
        status.style.display = 'block';
        status.innerText = "⚡ 1/2단계: 이미지에서 글자 읽는 중...";

        try {
            const result = await Tesseract.recognize(file, 'eng');
            const extractedText = result.data.text;
            
            status.innerText = "⚡ 2/2단계: AI가 불필요한 단어를 걸러내는 중...";
            const cleanedWords = await cleanWordsWithAI(extractedText);
            
            const inputArea = document.getElementById('wordInput');
            inputArea.value = inputArea.value ? inputArea.value + '\n' + cleanedWords : cleanedWords;
            alert("사진 속 글자 중 유용한 영단어만 추출했습니다!");
        } catch (e) {
            alert("이미지 처리 중 오류가 발생했습니다: " + e.message);
        } finally {
            status.style.display = 'none';
        }
    }

    // AI를 통한 단어 뜻 대량 번역
    async function translateWordsWithAI(wordList) {
        const apiKey = localStorage.getItem('voca_groq_key') || document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) return wordList.map(w => ({ word: w, meaning: "뜻 직접 입력" }));

        try {
            const prompt = `다음 영단어들의 핵심 한글 뜻을 1~2개로 간결하게 적어줘. 
형식: 단어: 한글뜻 (줄바꿈 구분)

단어 목록:
${wordList.join('\n')}`;

            const resText = await requestGroqAPI(prompt, apiKey);
            const resultMap = {};

            resText.split('\n').forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim().toLowerCase();
                    const val = parts.slice(1).join(':').trim();
                    resultMap[key] = val;
                }
            });

            return wordList.map(w => ({
                word: w,
                meaning: resultMap[w.toLowerCase()] || "뜻 직접 입력"
            }));
        } catch (e) {
            return wordList.map(w => ({ word: w, meaning: "뜻 직접 입력" }));
        }
    }

    async function addWords() {
        const text = document.getElementById('wordInput').value.trim();
        if (!text) return alert("단어를 입력하거나 파일/사진을 선택해주세요.");

        document.getElementById('loadingText').style.display = 'block';
        const rawList = text.replace(/,/g, '\n').split('\n').map(w => w.trim()).filter(w => w.length > 0);
        
        // 중복 제거
        const newWords = rawList.filter(w => !wordsDb.some(item => item.word.toLowerCase() === w.toLowerCase()));

        if (newWords.length > 0) {
            const translated = await translateWordsWithAI(newWords);
            translated.forEach(item => {
                wordsDb.push({
                    id: Date.now() + Math.random(),
                    word: item.word,
                    meaning: item.meaning,
                    collo: ""
                });
            });
        }

        document.getElementById('loadingText').style.display = 'none';
        alert(`${newWords.length}개 단어가 등록되었습니다!`);
        document.getElementById('wordInput').value = "";
        switchStep(2);
    }

    function renderStep2() {
        const listDiv = document.getElementById('editWordList');

        if (wordsDb.length === 0) {
            listDiv.innerHTML = "<p style='text-align:center; padding:12px; color:#71717a;'>등록된 단어가 없습니다.</p>";
            return;
        }

        listDiv.innerHTML = wordsDb.map((item, idx) => `
            <div class="word-card">
                <div class="word-title">${item.word}</div>
                <div class="word-subrow">
                    <input type="text" value="${item.meaning}" placeholder="한글 뜻" onchange="wordsDb[${idx}].meaning = this.value">
                    <button class="btn-action" onclick="getCollocations(${item.id}, '${item.word}')">💡 표현</button>
                    <button class="btn-delete" onclick="deleteWord(${item.id})">삭제</button>
                </div>
                <div id="collo-${item.id}" class="collo-box">${item.collo || ''}</div>
            </div>
        `).join('');

        wordsDb.forEach(item => {
            if (item.collo) {
                const box = document.getElementById(`collo-${item.id}`);
                if (box) box.style.display = 'block';
            }
        });
    }

    async function getCollocations(id, word) {
        const apiKey = localStorage.getItem('voca_groq_key') || document.getElementById('apiKeyInput').value.trim();
        const box = document.getElementById(`collo-${id}`);
        const targetItem = wordsDb.find(w => w.id === id);

        if (!apiKey) {
            promptApiKey();
            return;
        }

        if (box.style.display === 'block' && box.innerText.length > 0) {
            box.style.display = 'none';
            return;
        }

        box.style.display = 'block';
        box.innerText = "⚡ 주요 표현 찾는 중...";

        try {
            const prompt = `영어 단어 "${word}"의 대표 콜로케이션/자주 쓰는 표현 3가지를 한국어 뜻과 함께 아주 간결하게 적어줘.`;
            const text = await requestGroqAPI(prompt, apiKey);
            targetItem.collo = text;
            box.innerText = text;
        } catch (err) {
            box.innerText = "오류: " + err.message;
        }
    }

    function deleteWord(id) {
        wordsDb = wordsDb.filter(item => item.id !== id);
        renderStep2();
    }

    async function generateExamples() {
        if (wordsDb.length === 0) return alert("예문을 만들 단어가 없습니다. 1단계에서 단어를 올려주세요.");

        const apiKey = localStorage.getItem('voca_groq_key') || document.getElementById('apiKeyInput').value.trim();
        const comboCount = parseInt(document.getElementById('wordsPerSentence').value);
        const resultDiv = document.getElementById('exampleResult');
        const loading = document.getElementById('aiLoading');
        const genBtn = document.getElementById('genBtn');

        if (!apiKey) {
            promptApiKey();
            return;
        }

        loading.style.display = 'block';
        genBtn.disabled = true;
        resultDiv.innerHTML = "";

        const wordListStr = wordsDb.map(w => `${w.word} (${w.meaning})`).join(', ');

        try {
            const prompt = `너는 영단어 학습 도우미야.
제시된 단어들만 사용해서 아주 쉽고 간결한 영어 예문 스토리를 만들어줘.

[제시된 단어 목록]
${wordListStr}

[엄격 규칙]
1. 제시된 단어 목록에 있는 단어들 중에서 한 문장당 정확히 ${comboCount}개씩만 선택해서 조합해. 
2. 절대로 다른 제시되지 않은 어려운 단어나 복잡한 구문을 추가하지 마.
3. 각 문장은 10~12단어 안팎의 **짧고 쉬운 문장**이어야 해.
4. 문장들이 서로 이어지는 하나의 짧은 스토리 형태여야 해.

[출력 형식]
### 문장 [번호]
* **영어 예문:** (간결한 영어 문장)
* **한글 해석:** (자연스러운 번역)
* **포함된 단어:**
  * 단어1: 뜻
  * 단어2: 뜻
---`;

            const aiText = await requestGroqAPI(prompt, apiKey);
            resultDiv.innerHTML = `<div style="background:#18181b; padding:16px; border-radius:12px; border:1px solid #27272a; white-space:pre-wrap; font-size:14px; line-height:1.7;">${aiText}</div>`;
        } catch (err) {
            alert(err.message);
        }

        loading.style.display = 'none';
        genBtn.disabled = false;
    }
</script>
</body>
