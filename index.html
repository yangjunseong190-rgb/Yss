<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>월드박스 픽셀 시뮬레이터</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="월드박스">
  <meta name="theme-color" content="#1a1a1a">

  <style>
    /* iOS 꾹 누르기/선택/하이라이트 완전 차단 설정 */
    * { 
      box-sizing: border-box; 
      touch-action: none; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-touch-callout: none; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      margin: 0; 
      padding: 0; 
      background: #121212; 
      color: #eee; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 상태바 */
    .header {
      height: 44px;
      background: #222226;
      border-bottom: 2px solid #333338;
      display: flex;
      align-items: center;
      justify-content: space-around;
      font-size: 0.8rem;
      font-weight: bold;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #141416;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #3a3a40;
    }

    /* 메인 캔버스 영역 */
    #canvas-container {
      flex: 1;
      position: relative;
      background: #2b3925;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* 우측 줌 조작 버튼 */
    .zoom-controls {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }
    .zoom-btn {
      width: 42px;
      height: 42px;
      background: #3b3b42;
      color: #fff;
      border: 2px solid #555560;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .zoom-btn:active { background: #555560; transform: scale(0.95); }

    /* 하단 툴바 */
    .toolbar {
      height: 64px;
      background: #1c1c20;
      border-top: 2px solid #3a3a40;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 10px;
      z-index: 10;
    }
    .tool-btn {
      flex: 1;
      max-width: 75px;
      height: 48px;
      background: #2a2a30;
      border: 2px solid #44444e;
      border-radius: 8px;
      color: #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      gap: 2px;
      cursor: pointer;
    }
    .tool-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #fff;
      font-weight: bold;
    }
    .tool-btn span { font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="header">
    <div class="stat-badge">👤 인구: <span id="popCount" style="color:#60a5fa">0</span></div>
    <div class="stat-badge">🍎 음식: <span id="foodCount" style="color:#4ade80">0</span></div>
    <div class="stat-badge">👑 최고세대: <span id="maxGen" style="color:#facc15">1</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>
    
    <div class="zoom-controls">
      <div class="zoom-btn" onclick="zoom(1.25)">+</div>
      <div class="zoom-btn" onclick="zoom(0.8)">-</div>
      <div class="zoom-btn" style="font-size: 0.8rem;" onclick="resetCamera()">[ ]</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool-btn active" id="tool-spawn" onclick="selectTool('spawn')">
      <span>🚶</span>사람 생성
    </button>
    <button class="tool-btn" id="tool-food" onclick="selectTool('food')">
      <span>🍎</span>음식 투하
    </button>
    <button class="tool-btn" id="tool-heal" onclick="selectTool('heal')">
      <span>💖</span>치유의 비
    </button>
    <button class="tool-btn" id="tool-lightning" onclick="selectTool('lightning')">
      <span>⚡</span>신벌(번개)
    </button>
    <button class="tool-btn" id="tool-drag" onclick="selectTool('drag')">
      <span>✋</span>시점 이동
    </button>
  </div>

  <script>
    // iOS 꾹 누르기 컨텍스트 메뉴 차단
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const WORLD_WIDTH = 2400;
    const WORLD_HEIGHT = 2400;

    let scale = 0.5;
    let offsetX = (canvas.width - WORLD_WIDTH * scale) / 2;
    let offsetY = (canvas.height - WORLD_HEIGHT * scale) / 2;

    let currentTool = 'spawn';
    let humans = [];
    let foods = [];
    let effects = [];
    let maxGeneration = 1;

    const skinColors = ['#ffdbac', '#f1c27d', '#e0ac69', '#8d5524', '#c68642'];
    const clothesColors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6b7280'];

    class Human {
      constructor(x, y, dna = null, generation = 1) {
        this.x = x;
        this.y = y;
        this.hp = 100;
        this.maxHp = 100;
        this.energy = 80;
        this.age = 0;
        this.generation = generation;
        
        this.skin = skinColors[Math.floor(Math.random() * skinColors.length)];
        this.clothes = clothesColors[Math.floor(Math.random() * clothesColors.length)];

        if (dna) {
          this.speed = Math.max(1.0, dna.speed + (Math.random() - 0.5) * 0.4);
          this.sense = Math.max(40, dna.sense + (Math.random() - 0.5) * 10);
        } else {
          this.speed = 1.8 + Math.random() * 0.8;
          this.sense = 80 + Math.random() * 40;
        }

        this.vx = (Math.random() - 0.5) * this.speed;
        this.vy = (Math.random() - 0.5) * this.speed;
        this.walkTimer = 0;
      }

      update() {
        this.age += 0.02;
        this.energy -= 0.03 + (this.speed * 0.01);

        if (this.energy <= 0) {
          this.energy = 0;
          this.hp -= 0.15;
        }

        let closestFood = null;
        let minDist = Infinity;
        for (let f of foods) {
          const d = Math.hypot(f.x - this.x, f.y - this.y);
          if (d < this.sense && d < minDist) {
            minDist = d;
            closestFood = f;
          }
        }

        if (closestFood) {
          const angle = Math.atan2(closestFood.y - this.y, closestFood.x - this.x);
          this.vx = Math.cos(angle) * this.speed;
          this.vy = Math.sin(angle) * this.speed;

          if (minDist < 12) {
            this.energy = Math.min(100, this.energy + 50);
            this.hp = Math.min(this.maxHp, this.hp + 20);
            foods = foods.filter(item => item !== closestFood);
          }
        } else {
          this.walkTimer--;
          if (this.walkTimer <= 0) {
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * (this.speed * 0.6);
            this.vy = Math.sin(angle) * (this.speed * 0.6);
            this.walkTimer = Math.floor(Math.random() * 60) + 30;
          }
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 20 || this.x > WORLD_WIDTH - 20) this.vx *= -1;
        if (this.y < 20 || this.y > WORLD_HEIGHT - 20) this.vy *= -1;

        if (this.energy > 90 && this.age > 10) {
          this.energy -= 50;
          const nextGen = this.generation + 1;
          if (nextGen > maxGeneration) maxGeneration = nextGen;
          humans.push(new Human(this.x + (Math.random()*20-10), this.y + (Math.random()*20-10), { speed: this.speed, sense: this.sense }, nextGen));
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = this.skin;
        ctx.fillRect(-4, -12, 8, 7);

        ctx.fillStyle = this.clothes;
        ctx.fillRect(-5, -5, 10, 8);

        ctx.fillStyle = '#1f2937';
        ctx.fillRect(-4, 3, 3, 5);
        ctx.fillRect(1, 3, 3, 5);

        if (this.hp < this.maxHp || this.energy < 30) {
          ctx.fillStyle = '#000';
          ctx.fillRect(-8, -17, 16, 3);
          ctx.fillStyle = this.hp > 40 ? '#22c55e' : '#ef4444';
          ctx.fillRect(-8, -17, (this.hp / this.maxHp) * 16, 3);
        }

        ctx.restore();
      }
    }

    let isMouseDown = false;
    let lastX = 0, lastY = 0;

    function getTransformedPoint(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const screenX = clientX - rect.left;
      const screenY = clientY - rect.top;
      return {
        x: (screenX - offsetX) / scale,
        y: (screenY - offsetY) / scale
      };
    }

    function applyGodPower(pt) {
      if (pt.x < 0 || pt.x > WORLD_WIDTH || pt.y < 0 || pt.y > WORLD_HEIGHT) return;

      if (currentTool === 'spawn') {
        for(let i=0; i<2; i++) {
          humans.push(new Human(pt.x + (Math.random()*30-15), pt.y + (Math.random()*30-15)));
        }
      } else if (currentTool === 'food') {
        for(let i=0; i<3; i++) {
          foods.push({ x: pt.x + (Math.random()*40-20), y: pt.y + (Math.random()*40-20) });
        }
      } else if (currentTool === 'heal') {
        effects.push({ type: 'heal', x: pt.x, y: pt.y, radius: 60, life: 20 });
        for (let h of humans) {
          if (Math.hypot(h.x - pt.x, h.y - pt.y) < 60) {
            h.hp = h.maxHp;
            h.energy = 100;
          }
        }
      } else if (currentTool === 'lightning') {
        effects.push({ type: 'lightning', x: pt.x, y: pt.y, radius: 40, life: 10 });
        humans = humans.filter(h => Math.hypot(h.x - pt.x, h.y - pt.y) > 50);
        foods = foods.filter(f => Math.hypot(f.x - pt.x, f.y - pt.y) > 50);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      isMouseDown = true;
      lastX = e.clientX;
      lastY = e.clientY;

      const pt = getTransformedPoint(e.clientX, e.clientY);
      if (currentTool !== 'drag') {
        applyGodPower(pt);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;

      if (currentTool === 'drag') {
        offsetX += dx;
        offsetY += dy;
      } else {
        const pt = getTransformedPoint(e.clientX, e.clientY);
        if (Math.hypot(dx, dy) > 15) {
          applyGodPower(pt);
        }
      }
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('pointerup', () => isMouseDown = false);

    function zoom(factor) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const newScale = Math.min(Math.max(scale * factor, 0.2), 2.5);
      
      offsetX = centerX - (centerX - offsetX) * (newScale / scale);
      offsetY = centerY - (centerY - offsetY) * (newScale / scale);
      scale = newScale;
    }

    function resetCamera() {
      scale = 0.5;
      offsetX = (canvas.width - WORLD_WIDTH * scale) / 2;
      offsetY = (canvas.height - WORLD_HEIGHT * scale) / 2;
    }

    function selectTool(toolName) {
      currentTool = toolName;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tool-${toolName}`).classList.add('active');
    }

    function init() {
      humans = [];
      foods = [];
      resetCamera();

      for (let i = 0; i < 30; i++) {
        humans.push(new Human(WORLD_WIDTH / 2 + (Math.random()*300-150), WORLD_HEIGHT / 2 + (Math.random()*300-150)));
      }
      for (let i = 0; i < 60; i++) {
        foods.push({ x: WORLD_WIDTH / 2 + (Math.random()*500-250), y: WORLD_HEIGHT / 2 + (Math.random()*500-250) });
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      ctx.fillStyle = '#2b3925';
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      ctx.strokeStyle = '#232e1e';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      if (Math.random() < 0.2) {
        foods.push({ x: Math.random() * (WORLD_WIDTH - 100) + 50, y: Math.random() * (WORLD_HEIGHT - 100) + 50 });
      }

      ctx.fillStyle = '#ef4444';
      for (let f of foods) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(f.x - 1, f.y - 6, 2, 2);
        ctx.fillStyle = '#ef4444';
      }

      humans = humans.filter(h => h.hp > 0);
      for (let h of humans) {
        h.update();
        h.draw();
      }

      for (let i = effects.length - 1; i >= 0; i--) {
        let eff = effects[i];
        eff.life--;
        ctx.beginPath();
        ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
        if (eff.type === 'heal') {
          ctx.fillStyle = `rgba(74, 222, 128, ${eff.life / 20 * 0.4})`;
          ctx.fill();
        } else if (eff.type === 'lightning') {
          ctx.fillStyle = `rgba(255, 255, 255, ${eff.life / 10 * 0.8})`;
          ctx.fill();
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
        if (eff.life <= 0) effects.splice(i, 1);
      }

      ctx.restore();

      document.getElementById('popCount').innerText = humans.length;
      document.getElementById('foodCount').innerText = foods.length;
      document.getElementById('maxGen').innerText = maxGeneration;

      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
