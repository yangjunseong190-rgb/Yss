<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOCA MASTER - AI 예문 생성기</title>
    <style>
        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        input, textarea, select {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        body {
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: #121212;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #27272a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: #18181b;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #27272a;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 4px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #71717a;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #6366f1;
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        h2 { font-size: 16px; margin-bottom: 10px; font-weight: 700; color: #f4f4f5; }
        p, label { font-size: 13px; color: #a1a1aa; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; }

        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            appearance: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #6366f1 !important;
        }

        button.btn-primary {
            width: 100%;
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        button.btn-primary:active { background-color: #4f46e5; }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .btn-delete {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .loading {
            display: none;
            text-align: center;
            color: #818cf8;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }

        .example-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-left: 4px solid #6366f1;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .example-en { font-size: 15px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
        .example-ko { font-size: 13px; color: #34d399; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ AI 예문 생성기</h1>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchStep(1)">1. 단어 등록</button>
        <button class="tab-btn" onclick="switchStep(2)">2. 단어 관리</button>
        <button class="tab-btn" onclick="switchStep(3)">3. 예문 생성</button>
    </div>

    <!-- 1단계: 단어 등록 -->
    <div id="step1" class="step-panel active">
        <h2>📥 1단계: 단어 추가</h2>
        <p style="margin-bottom: 12px;">영어 단어를 입력하면 기본 한글 뜻을 자동으로 채워줍니다.</p>
        <div class="form-group">
            <textarea id="wordInput" rows="5" placeholder="영어 단어를 입력하세요 (줄바꿈 또는 쉼표 구분)&#10;예: resilience, meticulous, persistent"></textarea>
            <div id="loadingText" class="loading">⚡ 뜻 자동 번역 중...</div>
        </div>
        <button class="btn-primary" onclick="addWords()">단어 등록하기</button>
    </div>

    <!-- 2단계: 단어 관리 -->
    <div id="step2" class="step-panel">
        <h2>⚙️ 2단계: 단어 수정 및 AI 설정</h2>
        <div id="editWordList" style="margin-bottom: 20px; max-height: 250px; overflow-y: auto;"></div>

        <h2>🔑 Gemini API Key</h2>
        <div class="form-group">
            <input type="text" id="apiKeyInput" placeholder="발급받은 AI API 키 입력">
            <p style="font-size: 11px; color: #71717a; margin-top: 4px;">* API 키를 넣으면 AI가 높은 품질의 맞춤형 예문을 만들어 줍니다.</p>
        </div>
    </div>

    <!-- 3단계: 예문 생성 -->
    <div id="step3" class="step-panel">
        <h2>📖 3단계: 맞춤 예문 생성하기</h2>
        <p style="margin-bottom: 14px;">등록된 단어들을 활용해 맞춤형 영어 예문을 생성합니다.</p>
        
        <div class="form-group">
            <label>예문 생성 방식</label>
            <select id="genMode">
                <option value="single">단어 1개당 예문 1개 생성</option>
                <option value="combine">등록된 단어들을 조합한 예문 생성</option>
            </select>
        </div>

        <button class="btn-primary" id="genBtn" onclick="generateExamples()">✨ AI 예문 만들기</button>
        <div id="aiLoading" class="loading">🤖 AI가 자연스러운 예문을 작성하고 있습니다...</div>

        <div id="exampleResult" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    let wordsDb = [
        { id: 1, word: "resilience", meaning: "회복력, 탄력성" },
        { id: 2, word: "meticulous", meaning: "꼼꼼한, 세심한" }
    ];

    function switchStep(stepNum) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === stepNum - 1);
        });
        document.querySelectorAll('.step-panel').forEach((panel, idx) => {
            panel.classList.toggle('active', idx === stepNum - 1);
        });

        if (stepNum === 2) renderStep2();
    }

    async function fetchKoreanMeaning(word) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ko`);
            const data = await res.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (e) {}
        return "뜻 직접 입력";
    }

    async function addWords() {
        const text = document.getElementById('wordInput').value.trim();
        if (!text) return alert("단어를 입력해주세요.");

        document.getElementById('loadingText').style.display = 'block';
        const rawList = text.replace(/,/g, '\n').split('\n');
        let addedCount = 0;

        for (let w of rawList) {
            w = w.trim();
            if (w && !wordsDb.some(item => item.word.toLowerCase() === w.toLowerCase())) {
                const autoMeaning = await fetchKoreanMeaning(w);
                wordsDb.push({
                    id: Date.now() + Math.random(),
                    word: w,
                    meaning: autoMeaning
                });
                addedCount++;
            }
        }

        document.getElementById('loadingText').style.display = 'none';
        alert(`${addedCount}개 단어가 등록되었습니다!`);
        document.getElementById('wordInput').value = "";
        switchStep(2);
    }

    function renderStep2() {
        const listDiv = document.getElementById('editWordList');

        if (wordsDb.length === 0) {
            listDiv.innerHTML = "<p style='text-align:center; padding:12px; color:#71717a;'>등록된 단어가 없습니다.</p>";
            return;
        }

        listDiv.innerHTML = wordsDb.map((item, idx) => `
            <div class="word-item">
                <strong style="color:#818cf8; width: 30%; font-size:13px; overflow:hidden; text-overflow:ellipsis;">${item.word}</strong>
                <input type="text" value="${item.meaning}" style="width: 50%;" onchange="wordsDb[${idx}].meaning = this.value">
                <button class="btn-delete" onclick="deleteWord(${item.id})">삭제</button>
            </div>
        `).join('');
    }

    function deleteWord(id) {
        wordsDb = wordsDb.filter(item => item.id !== id);
        renderStep2();
    }

    async function generateExamples() {
        if (wordsDb.length === 0) return alert("예문을 만들 단어가 없습니다. 1단계에서 단어를 올려주세요.");

        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const mode = document.getElementById('genMode').value;
        const resultDiv = document.getElementById('exampleResult');
        const loading = document.getElementById('aiLoading');
        const genBtn = document.getElementById('genBtn');

        loading.style.display = 'block';
        genBtn.disabled = true;
        resultDiv.innerHTML = "";

        const wordListStr = wordsDb.map(w => `${w.word} (${w.meaning})`).join(', ');

        if (apiKey) {
            try {
                let prompt = "";
                if (mode === 'single') {
                    prompt = `다음 단어들 각각을 활용한 명확하고 실용적인 영어 예문과 한국어 번역을 만들어주세요.\n단어 목록: ${wordListStr}\n\n출력 형식(반드시 이 형식 유지):\n[단어]\n영어 예문\n한국어 번역\n---`;
                } else {
                    prompt = `다음 단어들을 2~3개씩 조합하여 영어 예문과 한국어 번역을 만들어주세요.\n단어 목록: ${wordListStr}\n\n출력 형식(반드시 이 형식 유지):\n[사용한 단어들]\n영어 예문\n한국어 번역\n---`;
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                
                resultDiv.innerHTML = `<div style="background:#18181b; padding:16px; border-radius:12px; border:1px solid #27272a; white-space:pre-wrap; font-size:14px; line-height:1.7;">${aiText}</div>`;
            } catch (err) {
                alert("API Key 오류 또는 요청 실패입니다. 기본 패턴 예문으로 대체합니다.");
                renderFallbackExamples(mode, resultDiv);
            }
        } else {
            renderFallbackExamples(mode, resultDiv);
        }

        loading.style.display = 'none';
        genBtn.disabled = false;
    }

    function renderFallbackExamples(mode, targetDiv) {
        let html = "";
        if (mode === 'single') {
            html = wordsDb.map(w => `
                <div class="example-card">
                    <div style="font-size:12px; color:#818cf8; font-weight:bold; margin-bottom:4px;">📌 ${w.word} (${w.meaning})</div>
                    <div class="example-en">This sentence demonstrates how to use "${w.word}".</div>
                    <div class="example-ko">이 문장은 "${w.meaning}" 단어의 사용법을 보여줍니다.</div>
                </div>
            `).join('');
        } else {
            const combinedWords = wordsDb.map(w => w.word).join(', ');
            html = `
                <div class="example-card">
                    <div style="font-size:12px; color:#818cf8; font-weight:bold; margin-bottom:4px;">📌 조합된 단어: ${combinedWords}</div>
                    <div class="example-en">It requires great effort and practice to master these vocabulary words.</div>
                    <div class="example-ko">이 단어들을 완벽히 익히기 위해서는 많은 노력과 연습이 필요합니다.</div>
                </div>
            `;
        }
        targetDiv.innerHTML = html;
    }
</script>
</body>
</html>
