<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4대 종족 시뮬레이션</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #555;
            background-color: #2b2b2b;
            margin-top: 10px;
        }
        #stats {
            margin-top: 10px;
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>

<div id="stats">
    <div>인간: <span id="human-count">0</span></div>
    <div>엘프: <span id="elf-count">0</span></div>
    <div>오크: <span id="orc-count">0</span></div>
    <div>드워프: <span id="dwarf-count">0</span></div>
</div>
<canvas id="simCanvas" width="800" height="600"></canvas>

<script>
// 1. 종족별 고유 스탯 및 특성(Trait) 정의
const RACE_DATA = {
    human: {
        name: 'Human',
        color: '#3498db',
        baseSpeed: 2.0,
        baseHp: 100,
        baseAtk: 10,
        baseDef: 5,
        reproduceRate: 0.003, // 높은 번식률
        maxAge: 3000,
        harvestMult: 1.0,
        destroyTreeOnGather: true,
        aggroRate: 0.2
    },
    elf: {
        name: 'Elf',
        color: '#2ecc71',
        baseSpeed: 2.4, // 이동속도 +20%
        baseHp: 90,
        baseAtk: 12,
        baseDef: 4,
        reproduceRate: 0.001,
        maxAge: 8000, // 긴 수명
        harvestMult: 1.0,
        destroyTreeOnGather: false, // 나무 채집 시 파괴하지 않음
        aggroRate: 0.1
    },
    orc: {
        name: 'Orc',
        color: '#e74c3c',
        baseSpeed: 2.0,
        baseHp: 150, // 체력 +50
        baseAtk: 22, // 높은 공격력
        baseDef: 3,
        reproduceRate: 0.0015,
        maxAge: 2500,
        harvestMult: 1.0,
        destroyTreeOnGather: true,
        aggroRate: 0.8 // 타 종족 공격성 높음
    },
    dwarf: {
        name: 'Dwarf',
        color: '#f39c12',
        baseSpeed: 1.8, // 이동속도 -10%
        baseHp: 130, // 높은 체력
        baseAtk: 14,
        baseDef: 12, // 높은 방어력
        reproduceRate: 0.001,
        maxAge: 4500,
        harvestMult: 2.0, // 채집 효율 2배
        destroyTreeOnGather: true,
        aggroRate: 0.3
    }
};

// 2. 자원 클래스 (나무)
class Resource {
    constructor(x, y, type = 'tree') {
        this.x = x;
        this.y = y;
        this.type = type;
        this.amount = 100;
        this.isDestroyed = false;
    }

    draw(ctx) {
        if (this.isDestroyed) return;
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 3. Citizen(시민) 클래스 확장
class Citizen {
    constructor(x, y, raceType = 'human') {
        this.x = x;
        this.y = y;
        this.race = raceType;
        
        // 종족 스탯적용
        const traits = RACE_DATA[this.race] || RACE_DATA['human'];
        this.traits = traits;
        
        this.speed = traits.baseSpeed;
        this.maxHp = traits.baseHp;
        this.hp = traits.baseHp;
        this.atk = traits.baseAtk;
        this.def = traits.baseDef;
        this.age = 0;
        this.inventory = 0;

        // 목표 지점 및 상태
        this.target = null;
        this.state = 'idle'; // 'idle', 'gathering', 'combat'
    }

    // 채집 로직
    gather(resource) {
        if (!resource || resource.isDestroyed) return;

        const distance = Math.hypot(resource.x - this.x, resource.y - this.y);
        if (distance < 10) {
            // 드워프 등 채집 효율 반영
            const gatherAmount = 5 * this.traits.harvestMult;
            this.inventory += gatherAmount;
            resource.amount -= gatherAmount;

            // 엘프 특성: 나무 채집 시 자원이 고갈되어도 나무를 파괴하지 않음
            if (resource.amount <= 0) {
                if (this.traits.destroyTreeOnGather) {
                    resource.isDestroyed = true;
                } else {
                    resource.amount = 100; // 엘시는 자원 지속 재생
                }
            }
        } else {
            this.moveTo(resource.x, resource.y);
        }
    }

    // 전투 로직 (오크 특성 연동)
    attack(target) {
        if (!target || target.hp <= 0) return;

        const distance = Math.hypot(target.x - this.x, target.y - this.y);
        if (distance < 12) {
            const damage = Math.max(1, this.atk - target.def);
            target.hp -= damage;
        } else {
            this.moveTo(target.x, target.y);
        }
    }

    // 번식 로직 (인간 높은 번식률 반영)
    tryReproduce(citizens) {
        if (Math.random() < this.traits.reproduceRate && this.inventory >= 20) {
            this.inventory -= 20;
            citizens.push(new Citizen(this.x + (Math.random() * 20 - 10), this.y + (Math.random() * 20 - 10), this.race));
        }
    }

    // 이동 감지
    moveTo(tx, ty) {
        const dx = tx - this.x;
        const dy = ty - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 1) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    // 상태 업데이트
    update(citizens, resources) {
        this.age++;

        // 수명 만료 및 체력 고갈 사망
        if (this.age > this.traits.maxAge || this.hp <= 0) {
            return false;
        }

        // 1. 타 종족 탐색 및 선제 공격 (공격성이 높은 종족 우선)
        let enemy = null;
        if (Math.random() < this.traits.aggroRate) {
            enemy = citizens.find(other => other !== this && other.race !== this.race && Math.hypot(other.x - this.x, other.y - this.y) < 100);
        }

        if (enemy) {
            this.state = 'combat';
            this.attack(enemy);
        } else {
            // 2. 자원 채집
            const targetResource = resources.find(r => !r.isDestroyed);
            if (targetResource) {
                this.state = 'gathering';
                this.gather(targetResource);
            } else {
                this.state = 'idle';
            }
        }

        // 3. 번식 체크
        this.tryReproduce(citizens);

        return true;
    }

    draw(ctx) {
        ctx.fillStyle = this.traits.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
        ctx.fill();

        // 체력바 표시
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(this.x - 8, this.y - 10, 16, 3);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(this.x - 8, this.y - 10, (16 * (this.hp / this.maxHp)), 3);
    }
}

// 4. 시뮬레이션 환경 구축 및 루프
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

const citizens = [];
const resources = [];

// 초기 엔티티 생성
function init() {
    const races = ['human', 'elf', 'orc', 'dwarf'];
    
    // 각 종족별 5명씩 생성
    races.forEach(race => {
        for (let i = 0; i < 5; i++) {
            citizens.push(new Citizen(Math.random() * canvas.width, Math.random() * canvas.height, race));
        }
    });

    // 자원 10개 생성
    for (let i = 0; i < 10; i++) {
        resources.push(new Resource(Math.random() * canvas.width, Math.random() * canvas.height));
    }
}

function updateUI() {
    const counts = { human: 0, elf: 0, orc: 0, dwarf: 0 };
    citizens.forEach(c => counts[c.race]++);
    
    document.getElementById('human-count').innerText = counts.human;
    document.getElementById('elf-count').innerText = counts.elf;
    document.getElementById('orc-count').innerText = counts.orc;
    document.getElementById('dwarf-count').innerText = counts.dwarf;
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 자원 그리기
    resources.forEach(r => r.draw(ctx));

    // 개체 업데이트 및 그리기
    for (let i = citizens.length - 1; i >= 0; i--) {
        const alive = citizens[i].update(citizens, resources);
        if (!alive) {
            citizens.splice(i, 1);
        } else {
            citizens[i].draw(ctx);
        }
    }

    updateUI();
    requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
